name: ul7256verify
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          bash ul-bin/verify.sh > /tmp/v.log 2>&1
          tail -40 /tmp/v.log
          B=$(base64 -w0 /tmp/v.log)
          printf '{"message":"verify","content":"%s","branch":"main"}' "$B" > /tmp/b.json
          curl -s -m 40 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/verify-$GITHUB_RUN_ID.b64" -o /dev/null -w "PUT %{http_code}\n"
          exit 0
