name: vantage-repoint
on:
  workflow_dispatch:
    inputs:
      host:
        description: "target host"
        default: "123.184.7.135"
      prefix:
        description: "worker prefix"
        default: "ul-t2-123-184-7-135"
      script:
        description: "repo script to pipe over ssh"
        default: "vantage/repoint135.sh"
permissions:
  contents: write
jobs:
  rp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: |
          curl -s -m 10 https://api.ipify.org; echo
      - name: repoint
        env:
          HOST: ${{ inputs.host }}
          PREFIX: ${{ inputs.prefix }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set +e
          mkdir -p vantage/out
          chmod 600 keys2/k04_ibm_key.pem_
          w=$(echo "$HOST" | tr '.' '-')
          timeout 900 ssh -i keys2/k04_ibm_key.pem_ -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o IdentitiesOnly=yes root@"$HOST" "PREFIX=$PREFIX bash -s" < "$SCRIPT" 2>&1 | tee vantage/out/repoint_$w.log
      - name: pool-verify
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          set +e
          python3 vantage/poolcheck.py 2>&1 | tee vantage/out/pool_${{ inputs.prefix }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrepoint
          path: vantage/out/
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local
          git config user.name ul
          git checkout -b vrepoint/${{ github.run_id }}
          git add -f vantage/out/
          git commit -m "vrepoint ${{ github.run_id }}"
          git push -q origin HEAD:vrepoint/${{ github.run_id }}
