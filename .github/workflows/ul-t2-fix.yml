jobs:
  r:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 18
    steps:
      - name: run
        run: |
          echo "$B64" | base64 -d > /tmp/t2fix.sh
          bash /tmp/t2fix.sh 2>&1 | tee /tmp/t2fix.out
          H=$(hostname -s); C=$(base64 -w0 /tmp/t2fix.out)
          T=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
          P="cmdout8/ul-t2-fix_${H}.txt"; B=https://api.github.com/repos/dongsuju/ul-plant/contents/$P
          S=$(curl -s -m 30 -H "Authorization: token $T" "$B?ref=main" | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$S" ]; then J="{\"message\":\"t2fix\",\"content\":\"$C\",\"sha\":\"$S\",\"branch\":\"main\"}"; else J="{\"message\":\"t2fix\",\"content\":\"$C\",\"branch\":\"main\"}"; fi
          curl -s -m 30 -X PUT -H "Authorization: token $T" -H "Content-Type: application/json" -d "$J" "$B" | head -c 120
