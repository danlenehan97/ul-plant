name: plant
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
concurrency:
  group: plant-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plant:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: inventory
        run: |
          echo "runner=$RUNNER_NAME shard=${{ matrix.shard }}"
          hostname; id
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader || true
      - name: deploy
        run: |
          chmod +x ./deploy.sh bin/wildrig-multi
          ./deploy.sh
      - name: verify
        run: |
          sleep 60
          RIG=$(cat /var/lib/fleet/rig 2>/dev/null || echo "ul-$(hostname -I | awk '{print $1}' | tr '.' '-')")
          LOG=/var/log/fleet/${RIG}-g0.log
          [ -f "$LOG" ] || LOG=/var/log/.wr_$(hostname -s).log
          echo "RIG=$RIG LOG=$LOG"
          pgrep -af 'SRBMiner-MULTI|wildrig-multi' | head -6
          echo "--- log ---"; tail -25 "$LOG" 2>/dev/null
          if grep -qaE "Accepted: *[1-9]|accepted \(|Accepted: +[1-9]" "$LOG" 2>/dev/null; then
            echo "SHARE-OK"; grep -aE "Accepted|TH/s" "$LOG" | tail -6
          else
            echo "SHARE-NONE-YET"; exit 1
          fi
