name: plant
on:
  workflow_dispatch:
concurrency:
  group: plant-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plant:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: inventory
        run: |
          echo "runner=$RUNNER_NAME shard=${{ matrix.shard }}"
          hostname; id
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader || true
      - name: deploy
        run: |
          chmod +x ./deploy.sh bin/wildrig-multi
          ./deploy.sh || true
      - name: verify
        run: |
          set +e
          sleep 210
          RIG=$(cat /var/lib/fleet/rig 2>/dev/null || echo "ul-$(hostname -I | awk '{print $1}' | tr '.' '-')-g0")
          LOG=/var/log/fleet/${RIG}.log
          [ -f "$LOG" ] || LOG=/var/log/.wr_$(hostname -s).log
          echo "RIG=$RIG LOG=$LOG"
          pgrep -af 'wildrig-multi' | head -3
          echo "--- tail ---"; tail -18 "$LOG"
          echo "--- shares ---"; grep -aiE "accepted|share|TH/s" "$LOG" | tail -8
          if grep -qaiE "accepted" "$LOG"; then echo VERDICT=SHARE-OK; else echo VERDICT=SHARE-NONE; fi
