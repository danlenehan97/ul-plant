name: i5542-mtls
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe|matrix"
        default: "probe"
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: curl -s -m 10 https://api.ipify.org; echo
      - name: setup
        run: pip install -q requests
      - name: run
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          EGRESS_IP=$(curl -s -m 10 https://api.ipify.org) python3 matrix.py 2>&1 | tee i5542_run.log
          echo "exit=$?"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5542-${{ github.run_id }}
          path: |
            i5542/out/
            i5542*.log
