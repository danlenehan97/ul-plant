name: ul7256watch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  w:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          bash ul-bin/watch.sh > /tmp/w.log 2>&1
          tail -45 /tmp/w.log
          B=$(base64 -w0 /tmp/w.log)
          printf '{"message":"watch","content":"%s","branch":"main"}' "$B" > /tmp/b.json
          curl -s -m 40 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/watch-$GITHUB_RUN_ID.b64" -o /dev/null -w "PUT %{http_code}\n"
          exit 0
