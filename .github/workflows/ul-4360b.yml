name: ul-4360b
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: |
          mkdir -p ul4360b /tmp/kh
          chmod 700 /tmp/kh
          tar xzf keys/kh.b64 -C /tmp/kh 2>/dev/null
          find /tmp/kh -type f -exec chmod 600 {} \; 2>/dev/null
          ls /tmp/kh | head -3
      - name: diag
        run: bash tools/ul4360b.sh
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ul4360b-out
          path: ul4360b/
          if-no-files-found: error
