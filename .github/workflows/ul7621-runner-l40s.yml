name: ul7621-runner-l40s
on:
  workflow_dispatch:
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H: "149.81.10.242"
      U: ubuntu
      RNAME: ul-l40s-7621
    steps:
      - uses: actions/checkout@v4
      - name: ssh keys
        run: |
          mkdir -p ~/.ssh; cp keys2/k04_ibm_key.pem_ ~/.ssh/id_ul; chmod 600 ~/.ssh/id_ul
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' > ~/.ssh/config
      - name: registration token and install
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          TOK=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/dongsuju/ul-plant/actions/runners/registration-token | jq -r .token)
          echo "::add-mask::$TOK"
          printf '%s' "$TOK" > /tmp/regtok
          SSHOPTS="-i /home/runner/.ssh/id_ul -o IdentitiesOnly=yes -o ConnectTimeout=15"
          scp $SSHOPTS /tmp/regtok ul/7621_runner_up.sh $U@$H:/tmp/
          ssh $SSHOPTS $U@$H "bash /tmp/7621_runner_up.sh $RNAME self-hosted,gpu,ul-l40s"
      - name: verify online
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for i in $(seq 1 20); do
            S=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/dongsuju/ul-plant/actions/runners | jq -c '[.runners[]|{name,status,labels:[.labels[].name]}]')
            echo "$S"
            echo "$S" | grep -q 'ul-l40s-7621","status":"online"' && break
            sleep 15
          done
