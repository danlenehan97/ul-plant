name: hkreach
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          chmod 600 az/azadmin.pem az/ibm_key.pem
          echo "RUNNER=$(hostname) EGRESS=$(curl -s -m 8 https://ifconfig.me)"
          n=0
          while IFS=$'\t' read -r name ip user rest; do
            n=$((n+1)); [ $n -gt 16 ] && break
            if timeout 5 bash -c "echo > /dev/tcp/$ip/22" 2>/dev/null; then
              echo "OPEN $name $ip"
              for K in az/azadmin.pem az/ibm_key.pem; do
                ssh -i $K -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o LogLevel=ERROR "$user@$ip" 'echo LOGIN_'"$(basename $K)"'=$(id -u)@$(hostname); nvidia-smi -L 2>/dev/null | head -2; pgrep -a wildrig | head -1; pgrep -a SRBMiner | head -1; pgrep -a krig | head -1; crontab -l 2>/dev/null | grep -c .' 2>&1 | head -8
              done
            else
              echo "CLOSED $name $ip"
            fi
          done < az/hosts.tsv
