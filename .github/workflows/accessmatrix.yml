name: accessmatrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true
      - name: matrix
        run: bash az/accessmatrix.sh 2>&1 | grep -vE 'Permanently added'
