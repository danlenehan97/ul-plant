name: ul8480
on:
  workflow_dispatch:
    inputs:
      script:
        description: "repo script to run over ssh"
        default: "vantage/gv8480/r1.sh"
      tag:
        description: "artifact tag"
        default: "r1"
      tmo:
        description: "timeout seconds"
        default: "600"
permissions:
  contents: write
jobs:
  ex:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: |
          curl -s -m 10 https://api.ipify.org; echo
      - name: exec
        env:
          SCRIPT: ${{ inputs.script }}
          TAG: ${{ inputs.tag }}
          TMO: ${{ inputs.tmo }}
        run: |
          set +e
          mkdir -p vantage/gv8480
          KEY=keys2/ul5817_key
          chmod 700 "$KEY" 2>/dev/null
          ls -l "$KEY"
          ssh-keygen -y -f "$KEY" | cut -c1-60
          H=123.184.7.135
          OK=0
          for try in 1 2 3; do
            if timeout 25 ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o IdentitiesOnly=yes root@$H 'id -u' >/dev/null 2>&1; then echo "PRECHECK_OK try=$try"; OK=1; break; fi
            echo "PRECHECK_FAIL try=$try"; sleep 8
          done
          if [ "$OK" = 1 ]; then
            timeout "$TMO" ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ServerAliveInterval=15 root@$H "TAG=$TAG bash -s" < "$SCRIPT" 2>&1 | tee "vantage/gv8480/${TAG}.log"
          else
            timeout 30 ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o IdentitiesOnly=yes -v root@$H 'id' > "vantage/gv8480/${TAG}.sshv" 2>&1
            echo "SSH_VERBOSE_SAVED"
            tail -25 "vantage/gv8480/${TAG}.sshv"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gv8480
          path: vantage/gv8480/
          if-no-files-found: warn
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local; git config user.name ul
          git checkout -b gv8480/${{ github.run_id }}
          git add -f vantage/gv8480/
          git commit -m "gv8480 ${{ github.run_id }} ${{ inputs.tag }}"
          git push -q origin HEAD:gv8480/${{ github.run_id }}
