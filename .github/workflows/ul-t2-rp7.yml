          if [ -n "$SHA" ]; then D="{\"message\":\"rp7\",\"content\":\"$C\",\"sha\":\"$SHA\",\"branch\":\"main\"}"; else D="{\"message\":\"rp7\",\"content\":\"$C\",\"branch\":\"main\"}"; fi
          curl -s -X PUT -H "Authorization: token $T" -H "Content-Type: application/json" -d "$D" "$B" | head -c 300
