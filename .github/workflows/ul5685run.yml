name: ul5685run
on:
  workflow_dispatch:
    inputs:
      script: {description: "path", default: "ul5685/scripts/a.sh"}
      runtag: {description: "tag", default: "run"}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GHT: 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
          RUNTAG: ${{ inputs.runtag }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set +e
          chmod +x "$SCRIPT" 2>/dev/null
          bash "$SCRIPT" > /tmp/rep 2>&1
          echo "EXIT=$?" >> /tmp/rep
          tail -c 200000 /tmp/rep
      - name: publish
        if: always()
        env:
          GHT: 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
          RUNTAG: ${{ inputs.runtag }}
        run: |
          set +e
          TOK="${GHT}"
          P="ul5685/out_${RUNTAG}.txt"
          B64=$(base64 -w0 /tmp/rep)
          SHA=$(curl -s -H "Authorization: token $TOK" "https://api.github.com/repos/dongsuju/ul-plant/contents/$P?ref=main" | python3 -c 'import sys,json
try: d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")
except: print("")')
          python3 -c "import json,sys;b={'message':'out','content':sys.argv[1],'branch':'main'};b.update({'sha':sys.argv[2]} if sys.argv[2] else {});open('/tmp/pb.json','w').write(json.dumps(b))" "$B64" "$SHA"
          curl -s -X PUT -H "Authorization: token $TOK" -H 'Content-Type: application/json' --data @/tmp/pb.json "https://api.github.com/repos/dongsuju/ul-plant/contents/$P" -o /tmp/pbr -w 'put=%{http_code}\n'
