name: i5542-docker
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "JSON array of docker base urls"
        default: '["http://192.168.120.227:2375"]'
      hosttag:
        description: "tag"
        default: "x"
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: run
        env:
          TARGETS: ${{ inputs.targets }}
          HOSTTAG: ${{ inputs.hosttag }}
        run: |
          set +e
          python3 docker_probe.py 2>&1 | tee i5542_docker.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5542-${{ github.run_id }}
          path: |
            i5542/out/
            i5542*.log
