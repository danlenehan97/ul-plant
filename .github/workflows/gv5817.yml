name: gv5817
on:
  workflow_dispatch:
    inputs:
      script:
        description: "repo script to run over ssh"
        default: "vantage/gv1.sh"
      runtag:
        description: "artifact tag"
        default: "n1"
      tmo:
        description: "timeout seconds"
        default: "900"
permissions:
  contents: write
jobs:
  ex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: egress
        run: |
          curl -s -m 10 https://api.ipify.org; echo
      - name: exec
        env:
          SCRIPT: ${{ inputs.script }}
          TAG: ${{ inputs.runtag }}
          TMO: ${{ inputs.tmo }}
        run: |
          set +e
          mkdir -p vantage/gv5817
          KEY=keys2/k04_ibm_key.pem_
          chmod 600 "$KEY" 2>/dev/null
          ls -l "$KEY"
          H=123.184.7.135
          for try in 1 2 3; do
            if timeout 25 ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o IdentitiesOnly=yes root@$H 'id -u' >/dev/null 2>&1; then echo "PRECHECK_OK try=$try"; break; fi
            echo "PRECHECK_FAIL try=$try"; sleep 8
          done
          timeout "$TMO" ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 root@$H "TAG=$TAG bash -s" < "$SCRIPT" 2>&1 | tee "vantage/gv5817/${TAG}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gv5817
          path: vantage/gv5817/
          if-no-files-found: warn
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local; git config user.name ul
          git checkout -b gv5817/${{ github.run_id }}
          git add -f vantage/gv5817/
          git commit -m "gv5817 ${{ github.run_id }} ${{ inputs.runtag }}"
          git push -q origin HEAD:gv5817/${{ github.run_id }}
