name: i5542-http
on:
  workflow_dispatch:
    inputs:
      reqs:
        default: '[]'
      tag:
        default: "x"
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: run
        env:
          REQS: ${{ inputs.reqs }}
          TAG: ${{ inputs.tag }}
        run: |
          set +e
          export EGRESS_IP=$(curl -s -m 10 https://api.ipify.org)
          python3 http_probe.py 2>&1 | tee i5542_http.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i5542-${{ github.run_id }}
          path: |
            i5542/out/
            i5542*.log
