name: ul5685spa
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: spa
        run: |
          set +e
          echo "=== .135:18080 bundle"
          curl -s -m 15 "http://123.184.7.135:18080/entry/js/index-C2Axc-oG.js" -o /tmp/j1 -w 'j1 %{http_code} %{size_download}\n'
          grep -oE '"/[a-zA-Z0-9_./-]{2,60}"' /tmp/j1 | sort -u | head -60
          echo "--- api-ish"
          grep -oE '(api|v1|login|upload|dataset|bench|vcc)[a-zA-Z0-9_/.-]{0,50}' /tmp/j1 | sort -u | head -40
          echo "--- strings"
          grep -oE 'https?://[a-zA-Z0-9_.:-]{4,80}' /tmp/j1 | sort -u | head -20
          echo "=== .135:18080 root html"
          curl -s -m 10 http://123.184.7.135:18080/ | head -c 800; echo
          echo "=== api prefix guesses"
          for p in /api/v1/system/version /api/v1/user/login /api/health /api/datasets /api/dataset/list /v1/kb/list /api/v1/dataset; do
            echo "-- $p"; curl -s -m 6 -o /tmp/x -w '  %{http_code} ' "http://123.184.7.135:18080$p"; head -c 120 /tmp/x; echo
          done
          echo "=== .192:18081"
          curl -s -m 10 http://123.184.7.192:18081/ -o /tmp/r2 -w 'r2 %{http_code} %{size_download}\n'; head -c 400 /tmp/r2; echo
          grep -oE 'src="[^"]+\.js"|href="[^"]+\.js"' /tmp/r2 | head -5
          echo "=== .135:18081 listing"
          curl -s -m 10 http://123.184.7.135:18081/ -o /tmp/r3 -w 'r3 %{http_code} %{size_download}\n'; head -c 600 /tmp/r3; echo
          echo "=== .135:443 page"
          curl -sk -m 10 https://123.184.7.135/ | head -c 600; echo
          echo DONE
